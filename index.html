<style>
/* Layout: one working column under a sticky role bar; each role gets its own tab, lists left / detail in a slide-over drawer */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunk:#EAEEF3; --ink:#142131; --muted:#5A6779; --line:#D9DFE7;
  --accent:#1E5AA8; --accent-ink:#FFFFFF; --accent-soft:#E3ECF8;
  --inb:#0D7A73; --inb-soft:#DDF2EF; --outb:#A35F00; --outb-soft:#FBEBD3;
  --ok:#1D7A3A; --ok-soft:#DFF3E4; --warn:#9A6200; --warn-soft:#FCEFD6; --bad:#B42318; --bad-soft:#FCE4E2;
  --shadow:0 10px 30px rgba(20,33,49,.16);
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E131A; --surface:#161D26; --sunk:#1D2631; --ink:#E5EAF1; --muted:#97A4B5; --line:#2A3542;
  --accent:#6EA4EE; --accent-ink:#0B1420; --accent-soft:#1D2E45;
  --inb:#3FC2B8; --inb-soft:#14302E; --outb:#E8A54B; --outb-soft:#372815;
  --ok:#5BC97A; --ok-soft:#16301F; --warn:#E5B04F; --warn-soft:#352914; --bad:#F27B70; --bad-soft:#3A1C1A;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#161D26; --sunk:#1D2631; --ink:#E5EAF1; --muted:#97A4B5; --line:#2A3542;
  --accent:#6EA4EE; --accent-ink:#0B1420; --accent-soft:#1D2E45;
  --inb:#3FC2B8; --inb-soft:#14302E; --outb:#E8A54B; --outb-soft:#372815;
  --ok:#5BC97A; --ok-soft:#16301F; --warn:#E5B04F; --warn-soft:#352914; --bad:#F27B70; --bad-soft:#3A1C1A;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.005em}
h2{font-size:22px;font-weight:600} h3{font-size:16px;font-weight:600}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:20px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px}
.brand h1{font-size:19px;font-weight:700}
.brand .mono{color:var(--muted)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
nav.tabs button{background:none;border:0;color:var(--muted);font:500 13.5px var(--f-body);padding:8px 12px;border-radius:6px;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
nav.tabs button:hover{color:var(--ink);background:var(--sunk)}
nav.tabs button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
.count{font:500 11px var(--f-mono);background:var(--bad);color:#fff;border-radius:10px;padding:1px 6px}
.count.n{background:var(--line);color:var(--ink)}
main{max-width:1240px;margin:0 auto;padding-block:22px 60px}
.view{display:grid;gap:18px}
.vhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.vhead p{margin:4px 0 0;color:var(--muted);max-width:68ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.panel>h3{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.formgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.formgrid,.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
label.f{display:block;font-size:12.5px;font-weight:500;color:var(--muted)}
label.f>input,label.f>select,label.f>textarea,label.f>.ta,label.f>.seg{display:block;margin-top:4px}
label.f>.seg{display:inline-flex}
label.f .req{color:var(--bad)}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{font:500 13.5px var(--f-body);border-radius:7px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:4px;font:500 11.5px var(--f-body);padding:2px 8px;border-radius:20px;background:var(--sunk);color:var(--muted);white-space:nowrap;letter-spacing:.01em}
.chip.inb{background:var(--inb-soft);color:var(--inb)} .chip.outb{background:var(--outb-soft);color:var(--outb)}
.st{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:4px;white-space:nowrap}
.st-New{background:var(--accent-soft);color:var(--accent)} .st-Info{background:var(--warn-soft);color:var(--warn)}
.st-Assigned{background:var(--sunk);color:var(--ink)} .st-Meeting{background:var(--inb-soft);color:var(--inb)}
.st-Quotation{background:var(--outb-soft);color:var(--outb)} .st-Won{background:var(--ok-soft);color:var(--ok)}
.st-Lost,.st-Rejected,.st-Duplicate{background:var(--bad-soft);color:var(--bad)} .st-On{background:var(--sunk);color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--muted);font:500 13px var(--f-body);padding:7px 14px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.cat button[data-v="Inbound"][aria-pressed="true"]{background:var(--inb);color:#fff}
.seg.cat button[data-v="Outbound"][aria-pressed="true"]{background:var(--outb);color:#fff}
/* account typeahead */
.ta{position:relative}
.sugg{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);z-index:5;max-height:300px;overflow:auto}
.sugg button{display:flex;width:100%;text-align:left;gap:8px;align-items:center;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 12px;color:var(--ink);font:inherit;cursor:pointer}
.sugg button:hover,.sugg button.hl{background:var(--accent-soft)}
.sugg .new{color:var(--accent);font-weight:500}
.acct{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.notice{border-radius:8px;padding:10px 12px;font-size:13px}
.notice.warn{background:var(--warn-soft);color:var(--warn)} .notice.bad{background:var(--bad-soft);color:var(--bad)} .notice.ok{background:var(--ok-soft);color:var(--ok)} .notice.info{background:var(--accent-soft);color:var(--accent)}
.prodgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.pchk{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:7px;padding:7px 9px;cursor:pointer;font-size:13px;background:var(--surface)}
.pchk input{width:auto;margin-top:3px}
.pchk.sel{border-color:var(--accent);background:var(--accent-soft)}
.pchk.blocked{opacity:.6;cursor:not-allowed;background:var(--sunk)}
.pchk.hist{border-style:dashed;border-color:var(--warn)}
.pchk small{display:block;color:var(--muted);font-size:11.5px;line-height:1.3}
.pchk.blocked small{color:var(--bad)}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--accent-soft)}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* queue cards */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:8px}
.qcard.flag{border-left:3px solid var(--warn)} .qcard.blockd{border-left:3px solid var(--bad)}
.qtop{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.qtop b{font-size:15px}
.kv{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.kv span b{color:var(--ink);font-weight:500}
/* pipeline board */
.board{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border-radius:10px;padding:10px;display:grid;gap:8px;align-content:start;min-height:120px}
.col h4{margin:0;font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between}
.lc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;cursor:pointer;display:grid;gap:4px;text-align:left;color:var(--ink);font:inherit;width:100%}
.lc:hover{border-color:var(--accent)}
.lc .amt{font:500 13px var(--f-mono)}
.lc .late{color:var(--bad);font-size:11.5px;font-weight:500}
/* KPIs + charts */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi .l{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi .v{font:600 26px var(--f-display);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.funnel{display:grid;gap:8px}
.frow{display:grid;grid-template-columns:130px minmax(0,1fr) 110px;gap:10px;align-items:center;font-size:13px}
.fbar{height:24px;background:var(--sunk);border-radius:5px;overflow:hidden}
.fbar i{display:block;height:100%;background:var(--accent);border-radius:5px;min-width:2px}
.frow .num{text-align:right;font-variant-numeric:tabular-nums}
.split{display:flex;height:30px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.split i{display:flex;align-items:center;justify-content:center;color:#fff;font:600 12px var(--f-body);min-width:0;overflow:hidden;white-space:nowrap}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg text{fill:var(--muted);font:11px var(--f-body)}
.alerts{display:grid;gap:6px}
.alert{display:flex;gap:10px;align-items:center;font-size:13px;padding:8px 10px;border-radius:7px;background:var(--sunk);cursor:pointer;border:0;color:var(--ink);text-align:left;font-family:inherit;width:100%}
.alert:hover{background:var(--accent-soft)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,16,24,.45);z-index:20;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(620px,100%);height:100%;overflow:auto;box-shadow:var(--shadow);display:grid;align-content:start;gap:14px;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(30px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.timeline{display:grid;gap:6px;font-size:12.5px}
.timeline div{display:grid;grid-template-columns:130px 1fr;gap:10px;color:var(--muted)}
.timeline div span:last-child{color:var(--ink)}
.stages{display:flex;gap:4px;flex-wrap:wrap}
.stages span{flex:1;min-width:70px;text-align:center;font:600 10.5px var(--f-body);text-transform:uppercase;letter-spacing:.05em;padding:6px 4px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.stages span.on{background:var(--accent);color:var(--accent-ink)}
.stages span.won{background:var(--ok);color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:40;font-size:13.5px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.banner{max-width:1240px;margin:0 auto}
.matrix td.c{text-align:center;padding:6px 4px}
.mx{display:inline-block;width:14px;height:14px;border-radius:3px;background:var(--line)}
.mx.open{background:var(--accent)} .mx.won{background:var(--ok)} .mx.hist{background:var(--warn)} .mx.lost{background:var(--bad)}
.listedit{display:grid;gap:6px}
.listedit .it{display:flex;gap:6px;align-items:center}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(30px);opacity:.6}}}
@media (max-width:560px){.frow{grid-template-columns:96px minmax(0,1fr) 84px}.timeline div{grid-template-columns:100px 1fr}}
</style>

<script>
/* ---------- defaults (used until the shared settings document loads) ---------- */
const DEFAULTS={products:["Passport / ID Scanner","eREG","VICAS","Tap & Smile","easyKIOSK","vMobile / Mobile Check-in","e-Invoicing","Mirror","Check-out Box","Dropbox","SamsoSign","Engage","eDOCS","OHIP Integration / Migration","OPERA Cloud Migration","OPERA Interface","Server Migration","Hardware (iPad / Tablet)","PMS"].map(n=>({name:n,repeatable:false})).concat([{name:"Additional Units / Upgrade",repeatable:true},{name:"AMC Renewal",repeatable:true}]),
 salespeople:["Advith","Burhan","Don","Himani","Imtishal","Mubeen","Mustafa","Nidhin","Pablo","Prajwal","Rizvi","Rodjard","Ruchita","Shahbaz","Shahzaman","Shijith","Sonali","Vishnu"],
 sources:["Support Team","AMC Team","Info Mailbox","Website / Chat","Oracle Marketplace","Newsletter","Events","PMS Vendor / Partner","Customer Referral"].map(n=>({name:n,cat:"Inbound"})).concat(["Email Marketing","Apollo","Cold Calling","LinkedIn Prospecting","Sales (self-generated)"].map(n=>({name:n,cat:"Outbound"}))),
 departments:["Marketing","Support","AMC","Sales","Info / Admin","Management"],
 fx:{AED:1,USD:3.6725,EUR:4.0,GBP:4.65,SAR:0.98,INR:0.042,MYR:0.83},
 weeklyTarget:25,slaVerifyHours:24,slaContactDays:3,quoteStaleDays:14,incentivePct:1};
const OPEN=["New","Info Needed","Assigned","Meeting Done","Quotation Sent","On Hold"];
const BLOCKING=OPEN.concat(["Won"]);
const STOP=new Set(["the","hotel","hotels","and","by","resort","resorts","spa","a","of","at","de","la","le"]);

const S={settings:DEFAULTS,registry:{},history:null,accounts:{},leads:[],leadMap:{},loaded:{leads:false,accounts:false},
  uid:null,canEdit:false,canWrite:null,db:null,user:null,downloads:null,tab:"new",period:"ytd",catFilter:"All",
  me:lsGet("ld.me")||"", form:null, drawer:null, acctQ:"", pq:"", users:{}, usersLoaded:false, role:null, myEng:"", isOwner:false, myName:"", names:{}, extLocks:{}};
const TABS={backoffice:["new","bo","pipe","mgmt","accts","set"],management:["mgmt","pipe","accts"],sales:["pipe"]};
const ROLE_LABEL={backoffice:"Back office",management:"Management",sales:"Sales engineer"};
const isBO=()=>S.role==="backoffice";
function canAct(l){return isBO()||(S.role==="sales"&&!!S.myEng&&nk(l.assignedTo)===nk(S.myEng))}
function computeRole(){if(S.isOwner){S.role="backoffice";S.myEng=(S.users[S.uid]||{}).engineer||"";return}const m=S.uid?S.users[S.uid]:null;S.role=m?.role||null;S.myEng=m?.engineer||""}

/* ---------- utils ---------- */
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
const $=s=>document.querySelector(s);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function keyOf(n){let s=String(n||"").toLowerCase().replace(/&/g," and ").replace(/[^a-z0-9 ]/g," ");
  const t=s.split(/\s+/).filter(w=>w&&!STOP.has(w));let k=t.join("-").slice(0,120);
  return k||String(n||"").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,120)}
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m||!n)return m||n;let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function similar(k1,k2){if(!k1||!k2)return 0;if(k1===k2)return 1;
  const A=new Set(k1.split("-")),B=new Set(k2.split("-"));let inter=0;A.forEach(x=>B.has(x)&&inter++);
  const jac=inter/(A.size+B.size-inter);const lr=1-lev(k1,k2)/Math.max(k1.length,k2.length);
  const contains=(k1.length>5&&k2.includes(k1))||(k2.length>5&&k1.includes(k2))?0.8:0;return Math.max(jac,lr,contains)}
const nowISO=()=>new Date().toISOString();
const days=iso=>iso?(Date.now()-new Date(iso).getTime())/864e5:0;
function fmtD(iso){if(!iso)return"—";const d=new Date(iso);return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})}
function fmtAED(n){n=Math.round(n||0);if(Math.abs(n)>=1e6)return"AED "+(n/1e6).toFixed(2)+"M";return"AED "+n.toLocaleString("en-US")}
function fmtN(n){return(n||0).toLocaleString("en-US")}
function toAED(v,c){const r=(S.settings.fx||{})[c]||1;return Math.round((+v||0)*r)}
const nk=s=>String(s||"").trim().replace(/\s+/g," ").toLowerCase();
function uniqList(arr,shape){const seen=new Set();return(arr||[]).map(shape).filter(x=>{const k=nk(x.name);if(!k||seen.has(k))return false;seen.add(k);return true})}
function spList(all){const l=uniqList(S.settings.salespeople,x=>typeof x==="string"?{name:x.trim(),active:true}:Object.assign({active:true},x));return all?l:l.filter(x=>x.active!==false)}
function prodList(all){const l=uniqList(S.settings.products,x=>typeof x==="string"?{name:x.trim(),repeatable:false,active:true}:Object.assign({active:true},x));return all?l:l.filter(x=>x.active!==false)}
const spNames=()=>spList().map(x=>x.name);
const productsOf=l=>Array.isArray(l.products)&&l.products.length?l.products:(l.product?[l.product]:[]);
function leadValue(l){return l.order?.aed??l.quote?.aed??l.meeting?.aed??0}
function stCls(s){return"st st-"+String(s).split(" ")[0]}
function catOf(src){return(S.settings.sources.find(x=>x.name===src)||{}).cat||"Inbound"}
function emailDomain(e){const m=String(e||"").toLowerCase().match(/@([a-z0-9.-]+)$/);if(!m)return"";const d=m[1];return/(gmail|yahoo|hotmail|outlook|live|icloud|aol)\./.test(d)?"":d}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function toast(msg){const h=$("#toastHost");h.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>h.innerHTML="",3800)}
function opts(list,sel,ph){return(ph?`<option value="">${esc(ph)}</option>`:"")+list.map(v=>`<option${v===sel?" selected":""}>${esc(v)}</option>`).join("")}

/* ---------- account + product duplicate logic ---------- */
function allAccounts(){const m={};for(const[k,a]of Object.entries(S.registry))m[k]={key:k,name:a.n,country:a.c,hist:a.p||{},wonHist:!!a.w,live:false};
  for(const[k,a]of Object.entries(S.accounts))m[k]=Object.assign(m[k]||{hist:{}},{key:k,name:a.name,country:a.country||m[k]?.country||"",city:a.city,group:a.group,live:true});return m}
function findAccounts(q,limit=8){const k=keyOf(q);if(!k)return[];const out=[];for(const a of Object.values(allAccounts())){const s=similar(k,a.key);if(s>=0.55)out.push([s,a])}
  return out.sort((x,y)=>y[0]-x[0]).slice(0,limit).map(x=>Object.assign({score:x[0]},x[1]))}
function leadsFor(key){return S.leads.filter(l=>l.accountKey===key)}
function productState(key,product,exceptId){const pdef=prodList(true).find(p=>p.name===product)||{};
  if(pdef.repeatable)return{state:"ok"};
  const live=leadsFor(key).filter(l=>l.id!==exceptId&&productsOf(l).includes(product)&&BLOCKING.includes(l.status));
  if(live.length){const l=live[0];return{state:"blocked",lead:l,msg:`${l.status==="Won"?"Already won":"Open"} · ${l.ref}${l.assignedTo?" · "+l.assignedTo:""}`}}
  const ext=(S.extLocks[key]||[]).find(r=>r.product===product&&r.ref!==exceptId&&BLOCKING.includes(r.status));
  if(ext)return{state:"blocked",lead:{id:ext.ref,ref:ext.ref,status:ext.status,assignedTo:ext.assigned_to},msg:`${ext.status==="Won"?"Already won":"Open"} · ${ext.ref}${ext.assigned_to?" · "+ext.assigned_to:""}`};
  const h=(S.registry[key]?.p||{})[product];
  if(h)return{state:"hist",msg:`In 2026 sheet · ${h.r}${h.e?" · "+h.e:""}`};
  return{state:"ok"}}
function dupChecks(l){const out=[];const others=S.leads.filter(x=>x.id!==l.id);
  productsOf(l).forEach(p=>{const ps=productState(l.accountKey,p,l.id);
    if(ps.state==="blocked"){const x=ps.lead;out.push({lvl:"bad",msg:`${p} is already ${x.status==="Won"?"won":"open"} for this account: ${x.ref} (${x.status}${x.assignedTo?", "+x.assignedTo:""})`,ref:x.id})}
    const h=(S.registry[l.accountKey]?.p||{})[p];if(h)out.push({lvl:"warn",msg:`${p} was logged in the 2026 sheet: ${h.r}${h.e?" with "+h.e:""}${h.m?" ("+h.m+")":""}`})});
  const em=(l.contact?.email||"").toLowerCase();if(em)others.filter(x=>(x.contact?.email||"").toLowerCase()===em&&x.accountKey!==l.accountKey).slice(0,2).forEach(x=>out.push({lvl:"warn",msg:`Same contact email used on another account: ${x.accountName} (${x.ref})`,ref:x.id}));
  const near=findAccounts(l.accountName,4).filter(a=>a.key!==l.accountKey&&a.score>=0.75);near.forEach(a=>out.push({lvl:"warn",msg:`Similar account exists: ${a.name}${a.country?" · "+a.country:""}`}));
  const dom=emailDomain(em);if(dom){const sib=others.filter(x=>emailDomain(x.contact?.email)===dom&&x.accountKey!==l.accountKey);if(sib.length)out.push({lvl:"info",msg:`${sib.length} other lead(s) share the domain @${dom} — possibly the same group or chain`})}
  return out}

/* ---------- boot ---------- */
async function boot(){
  bindTabs();const hash=location.hash.slice(1);if(["new","bo","pipe","mgmt","accts","set"].includes(hash))S.tab=hash;
  const [db,user,downloads]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("downloads")]);
  S.db=db;S.user=user;S.downloads=downloads;
  if(user){const me=await user.me();S.uid=me.id;S.isOwner=me.isOwner;S.myName=me.name;S.canEdit=await user.canEdit();S.canWrite=await user.can("data.write")}
  if(!db){$("#banner").innerHTML=`<div class="notice bad" style="margin-top:14px">The shared lead database isn't available in this view. Sign in to claude.ai and open the artifact link to enter and track leads.</div>`;render();return}
  const timer=setTimeout(()=>{if(!S.loaded.leads)$("#banner").innerHTML=`<div class="notice warn" style="margin-top:14px">Still waiting for the lead database. What you see may be incomplete.</div>`},10000);
  const errH=e=>{$("#banner").innerHTML=`<div class="notice bad" style="margin-top:14px">Lost connection to the lead database (${esc(e.code)}). Reload the page to reconnect.</div>`};
  db.doc("config/users").onSnapshot(s=>{S.users=s.exists?(s.data().members||{}):{};const before=S.role+"|"+S.myEng;S.usersLoaded=true;computeRole();if(before!==S.role+"|"+S.myEng)render();else softRender()},e=>{S.usersLoaded=true;computeRole();render();errH(e)});
  db.doc("config/settings").onSnapshot(s=>{if(s.exists)S.settings=Object.assign({},DEFAULTS,s.data());softRender()},errH);
  db.doc("history/2026").get().then(s=>{if(s.exists){S.history=s.data();softRender()}}).catch(()=>{});
  Promise.all(["accounts-1","accounts-2"].map(id=>db.doc("registry/"+id).get())).then(ss=>{ss.forEach(s=>s.exists&&Object.assign(S.registry,s.data().a||{}));softRender()}).catch(()=>{});
  db.collection("accounts").onSnapshot(q=>{S.accounts={};q.docs.forEach(d=>S.accounts[d.id]=d.data());S.loaded.accounts=true;softRender()},errH);
  db.collection("leads").onSnapshot(q=>{S.leads=q.docs.map(d=>Object.assign({id:d.id},d.data()));S.leadMap={};S.leads.forEach(l=>S.leadMap[l.id]=l);
    if(!q.metadata.fromCache){S.loaded.leads=true;clearTimeout(timer);if($("#banner").textContent.includes("Still waiting"))$("#banner").innerHTML=""}softRender()},e=>{clearTimeout(timer);errH(e)});
  render();
}
function bindTabs(){$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]");if(!b)return;S.tab=b.dataset.tab;try{history.replaceState(null,"","#"+S.tab)}catch(_){location.hash=S.tab}render()});
  window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h&&h!==S.tab&&document.querySelector(`[data-tab="${h}"]`)){S.tab=h;render()}})}

/* full render on tab switch; soft render on data change keeps forms intact */
function render(){const m=$("#main");
  if(!S.db){m.innerHTML=`<div class="panel empty">Lead Desk needs you to be signed in to claude.ai with access to this page.</div>`;$("#tabs").hidden=true;return}
  if(!S.usersLoaded){m.innerHTML=`<div class="panel empty">Checking your access…</div>`;$("#tabs").hidden=true;return}
  if(!S.role){$("#tabs").hidden=true;$("#who").innerHTML="";m.innerHTML=`<section class="view" style="max-width:560px;margin:40px auto"><div class="panel" style="padding:28px;display:grid;gap:10px"><h2>You don't have access yet</h2>
    <p class="muted" style="margin:0">${S.uid?`You're signed in${S.myName?" as <b>"+esc(S.myName)+"</b>":""}, but you aren't on the Lead Desk user list.`:"Lead Desk couldn't identify your account."} Ask a back-office user to add you under Products &amp; settings → Users and access, then reload this page.</p>${window.LD_HOSTED?`<div><button class="btn" onclick="window.__signOut()">Sign out</button></div>`:""}</div></section>`;return}
  const allowed=TABS[S.role];if(!allowed.includes(S.tab))S.tab=allowed[0];
  $("#tabs").hidden=allowed.length<2;
  document.querySelectorAll("#tabs button").forEach(b=>{b.hidden=!allowed.includes(b.dataset.tab);b.setAttribute("aria-selected",b.dataset.tab===S.tab)});
  const pt=document.querySelector('#tabs [data-tab="pipe"]');pt.textContent=S.role==="sales"?"My leads":S.role==="management"?"Team pipeline":"Pipelines";
  $("#who").innerHTML=`<span class="chip">${esc(ROLE_LABEL[S.role])}${S.role==="sales"&&S.myEng?" · "+esc(S.myEng):""}</span>`+(S.myName?` <span class="small muted">${esc(S.myName)}</span>`:"")+(window.LD_HOSTED?` <button class="btn sm" onclick="window.__changePassword()">Password</button> <button class="btn sm" onclick="window.__signOut()">Sign out</button>`:"");
  $("#banner").querySelector("[data-perm]")?.remove();
  if(isBO()&&!S.canEdit&&!S.isOwner)$("#banner").insertAdjacentHTML("beforeend",`<div data-perm class="notice warn" style="margin-top:14px">Your share access to this page isn't Editor, so saving products, settings and users will fail. Ask the owner to make you an Editor.</div>`);
({new:renderNew,bo:renderBO,pipe:renderPipe,mgmt:renderMgmt,accts:renderAccts,set:renderSet})[S.tab](m);updateCounts()}
function softRender(){updateCounts();if(!S.role||!S.usersLoaded)return render();if(S.tab==="new"){if(!$("#leadForm"))render();else refreshFormChecks()}else if(S.tab==="set"){if(!$("#setForm")||!document.activeElement||!document.activeElement.closest("#main"))render()}else{const y=scrollY;render();scrollTo(0,y)}
  if(S.drawer)refreshDrawer()}
function updateCounts(){if(!isBO()){$("#c-bo").hidden=true;return}const n=S.leads.filter(l=>l.status==="New"||l.status==="Info Needed").length;const c=$("#c-bo");c.hidden=!n;c.textContent=n}

async function submitLead(){const f=S.form,msg=$("#submitMsg"),btn=$("#submitBtn");const v=id=>($("#"+id)?.value||"").trim();
  const errs=[];if(!f.account)errs.push("Choose or create the account");
  if(f.account?.isNew&&!(f.account.country||"").trim())errs.push("Add the account's country");
  if(!v("f-cname"))errs.push("Add the contact person");
  if(!v("f-cemail")&&!v("f-cphone"))errs.push("Add an email or phone");
  if(v("f-cemail")&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v("f-cemail")))errs.push("Check the email address");
  if(!f.products.length)errs.push("Select at least one product");
  if(!f.category)errs.push("Choose Inbound or Outbound");
  if(!v("f-source"))errs.push("Choose the source channel");
  if(!v("f-genby"))errs.push("Add who generated the lead");
  if(errs.length){msg.innerHTML=`<div class="notice bad">${errs.map(esc).join(" · ")}</div>`;return}
  if(!S.db){msg.innerHTML=`<div class="notice bad">The lead database isn't available. Sign in and reopen the page.</div>`;return}
  const a=f.account;
  // final duplicate guard against the latest live data
  const blocked=f.products.filter(p=>productState(a.key,p).state==="blocked");
  if(blocked.length){msg.innerHTML=`<div class="notice bad">${esc(blocked.join(", "))} became active for this account while you were typing. Untick it to continue.</div>`;drawProducts();return}
  btn.disabled=true;btn.textContent="Saving…";lsSet("ld.genby",v("f-genby"));lsSet("ld.dept",v("f-dept"));
  try{
    const aref=S.db.doc("accounts/"+a.key);const ex=await aref.get();
    if(!ex.exists)await aref.set({name:a.name,key:a.key,country:(a.country||"").trim(),city:(a.city||"").trim(),group:(a.group||"").trim(),domain:emailDomain(v("f-cemail")),createdAt:nowISO(),createdBy:S.uid||null,fromSheet:!!S.registry[a.key]});
    const ref=await nextRef();const t=nowISO();const ps=f.products.slice();
    await S.db.doc("leads/"+ref).set({ref,accountKey:a.key,accountName:a.name,country:(a.country||S.accounts[a.key]?.country||"").trim(),
        contact:{name:v("f-cname"),title:v("f-ctitle"),email:v("f-cemail"),phone:v("f-cphone")},products:ps,product:ps.join(", "),category:f.category,source:v("f-source"),
        generatedBy:v("f-genby"),department:v("f-dept"),rooms:+v("f-rooms")||null,pms:v("f-pms"),timeline:v("f-when"),preferred:v("f-pref"),notes:v("f-notes"),
        status:"New",assignedTo:"",priority:"",createdAt:t,createdBy:S.uid||null,stageAt:{New:t},histRepeat:ps.some(p=>productState(a.key,p).state==="hist"),
        log:[{t,by:"",byId:S.uid||null,a:"Lead submitted · "+ps.join(", ")+" (generated by "+v("f-genby")+")"}]});
    S.form=null;render();$("#submitMsg").innerHTML=`<div class="notice ok">Submitted <span class="mono">${ref}</span> with ${ps.length} product${ps.length>1?"s":""}. Back office will verify and assign it.</div>`;scrollTo(0,0);
  }catch(e){btn.disabled=false;btn.textContent="Submit for verification";msg.innerHTML=`<div class="notice bad">Couldn't save the lead (${esc(e.code||e.message)}). ${e.code==="invalid_argument"?"Your access may be view-only; ask the owner for Contributor access.":"Try again."}</div>`}}
async function nextRef(){if(window.LD_HOSTED){const{data,error}=await window.__sb.rpc("next_lead_ref");if(error)throw{code:error.code==="42501"?"invalid_argument":"unavailable",message:error.message};return data}
  const r=S.db.doc("meta/counter");const holder=S.uid||("t"+Math.random().toString(36).slice(2));
  for(let i=0;i<12;i++){const g=await r.acquire({holder,ttlMs:2000});
    if(g.acquired){const s=await r.get();const d=s.exists?s.data():{};const y=new Date().getFullYear();let n=(d.year===y?d.next:1)||1;
      let ref;for(;;){ref=`LD${y}-${String(n).padStart(4,"0")}`;const ex=await S.db.doc("leads/"+ref).get();if(!ex.exists)break;n++}
      await r.set({year:y,next:n+1});return ref}
    await sleep(500+Math.random()*700)}
  throw{code:"busy",message:"Reference counter busy, try again"}}

function catBlock(a,b,lab,money){const t=a+b;const pa=t?a/t*100:50;return`<div style="margin-bottom:10px"><div class="legend" style="margin-bottom:5px"><span><i style="background:var(--inb)"></i>Inbound ${money?fmtAED(a):fmtN(a)}</span><span><i style="background:var(--outb)"></i>Outbound ${money?fmtAED(b):fmtN(b)}</span><span class="sp"></span><span>${lab}</span></div>
  <div class="split">${t?`<i style="width:${pa}%;background:var(--inb)">${pa>=12?Math.round(pa)+"%":""}</i><i style="width:${100-pa}%;background:var(--outb)">${100-pa>=12?Math.round(100-pa)+"%":""}</i>`:""}</div></div>`}
function grpTable(rows,label,showPipe){return`<div class="tw"><table><thead><tr><th>${label}</th><th class="num">Leads</th><th class="num">Meetings</th><th class="num">Quotes</th><th class="num">Won</th><th class="num">Conv.</th>${showPipe?`<th class="num">Open pipeline</th>`:""}<th class="num">Won value</th></tr></thead><tbody>
  ${rows.map(([n,o])=>`<tr><td>${esc(n)}${showPipe?` <span class="chip ${catOf(n)==="Outbound"?"outb":"inb"}">${catOf(n)==="Outbound"?"Out":"In"}</span>`:""}</td><td class="num">${o.n}</td><td class="num">${o.meet}</td><td class="num">${o.quote}</td><td class="num">${o.won}</td><td class="num">${o.n?(o.won/o.n*100).toFixed(0)+"%":"—"}</td>${showPipe?`<td class="num">${fmtAED(o.pipe)}</td>`:""}<td class="num">${fmtAED(o.wonV)}</td></tr>`).join("")||`<tr><td colspan="8" class="empty">No leads in this period.</td></tr>`}</tbody></table></div>`}
function weeklySeries(n){const out=[];const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));
  for(let i=n-1;i>=0;i--){const s=new Date(d);s.setDate(s.getDate()-7*i);const e=new Date(s);e.setDate(e.getDate()+7);
    const ls=S.leads.filter(l=>{const c=new Date(l.createdAt);return c>=s&&c<e&&!["Duplicate","Rejected"].includes(l.status)});
    out.push({label:s.toLocaleDateString("en-GB",{day:"2-digit",month:"short"}),in:ls.filter(l=>l.category!=="Outbound").length,out:ls.filter(l=>l.category==="Outbound").length})}return out}
function weekChart(ws,target){const W=760,H=200,pl=34,pb=26,pt=10;const mx=Math.max(target*1.2,...ws.map(w=>w.in+w.out),1);const step=Math.ceil(mx/4/5)*5||5;const top=step*4;
  const bw=(W-pl-10)/ws.length;const y=v=>pt+(H-pt-pb)*(1-v/top);
  let g="";for(let v=0;v<=top;v+=step)g+=`<line x1="${pl}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const bars=ws.map((w,i)=>{const x=pl+i*bw+bw*.18,ww=bw*.64;return`<rect x="${x}" y="${y(w.in)}" width="${ww}" height="${y(0)-y(w.in)}" fill="var(--inb)" rx="2"/><rect x="${x}" y="${y(w.in+w.out)}" width="${ww}" height="${y(w.in)-y(w.in+w.out)}" fill="var(--outb)" rx="2"/>${i%2===ws.length%2?"":`<text x="${x+ww/2}" y="${H-8}" text-anchor="middle">${w.label}</text>`}`}).join("");
  return`<div class="legend" style="margin-bottom:6px"><span><i style="background:var(--inb)"></i>Inbound</span><span><i style="background:var(--outb)"></i>Outbound</span><span><i style="background:var(--bad);height:2px"></i>Target ${target}/week</span></div>
   <div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:520px;height:auto" role="img" aria-label="Weekly leads, last ${ws.length} weeks">${g}${bars}<line x1="${pl}" x2="${W-6}" y1="${y(target)}" y2="${y(target)}" stroke="var(--bad)" stroke-dasharray="5 4"/></svg></div>`}
function baseline(){const h=S.history;if(!h)return"";const ms=Object.keys(h.leadsByMonth);const W=760,H=210,pl=40,pr=56,pb=26,pt=12;
  const mxL=Math.max(...ms.map(k=>h.leadsByMonth[k]));const mxV=Math.max(...ms.map(k=>h.orderValueByMonth[k]||0),1);const topL=Math.ceil(mxL/50)*50,topV=Math.ceil(mxV/1e5)*1e5;
  const bw=(W-pl-pr)/ms.length;const y=(v,t)=>pt+(H-pt-pb)*(1-v/t);
  let g="";for(let i=0;i<=4;i++){const v=topL/4*i;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v,topL)}" y2="${y(v,topL)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v,topL)+4}" text-anchor="end">${v}</text><text x="${W-pr+6}" y="${y(v,topL)+4}">${(topV/4*i/1000).toFixed(0)}k</text>`}
  const bars=ms.map((k,i)=>{const x=pl+i*bw+bw*.2,ww=bw*.6;const mn=new Date(k+"-01").toLocaleDateString("en-GB",{month:"short"});return`<rect x="${x}" y="${y(h.leadsByMonth[k],topL)}" width="${ww}" height="${y(0,topL)-y(h.leadsByMonth[k],topL)}" fill="var(--accent)" opacity=".75" rx="2"/><text x="${x+ww/2}" y="${H-8}" text-anchor="middle">${mn}</text>`}).join("");
  const pts=ms.map((k,i)=>[pl+i*bw+bw/2,y(h.orderValueByMonth[k]||0,topV)]);
  const line=`<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--ok)" stroke-width="2.5"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--ok)"/>`).join("");
  const src=Object.entries(h.leadsBySource).filter(([k])=>k!=="Other");
  return`<div class="panel"><div class="row" style="margin-bottom:10px"><h3>2026 baseline from the Excel workbook</h3><span class="chip">to ${fmtD(h.asOf)}</span></div>
   <div class="kpis" style="margin-bottom:14px"><div class="kpi"><div class="l">Leads logged</div><div class="v">${fmtN(h.leads)}</div><div class="s">${fmtN(h.accounts)} unique properties</div></div><div class="kpi"><div class="l">Orders</div><div class="v">${h.orders}</div><div class="s">${(h.orders/h.leads*100).toFixed(1)}% of leads</div></div><div class="kpi"><div class="l">Order value</div><div class="v">${fmtAED(h.orderValueAED)}</div><div class="s">avg ${fmtAED(h.orderValueAED/h.orders)}</div></div><div class="kpi"><div class="l">Inbound share</div><div class="v">${Math.round(h.leadsByCategory.Inbound/h.leads*100)}%</div><div class="s">${Math.round(h.orderValueByCategory.Inbound/h.orderValueAED*100)}% of order value</div></div></div>
   <div class="legend" style="margin-bottom:6px"><span><i style="background:var(--accent)"></i>Leads per month (left)</span><span><i style="background:var(--ok)"></i>Order value AED (right)</span></div>
   <div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:520px;height:auto" role="img" aria-label="2026 monthly leads and order value">${g}${bars}${line}</svg></div>
   <div class="tw" style="margin-top:14px"><table><thead><tr><th>Source (sheet)</th><th class="num">Leads</th><th class="num">Orders</th><th class="num">Conv.</th><th class="num">Order value</th></tr></thead><tbody>
   ${src.map(([k,n])=>`<tr><td>${esc(k)} <span class="chip ${catOf(k)==="Outbound"?"outb":"inb"}">${catOf(k)==="Outbound"?"Out":"In"}</span></td><td class="num">${n}</td><td class="num">${h.ordersBySource[k]||0}</td><td class="num">${((h.ordersBySource[k]||0)/n*100).toFixed(1)}%</td><td class="num">${fmtAED(h.orderValueBySource[k]||0)}</td></tr>`).join("")}</tbody></table></div></div>`}
async function exportCSV(){const cols=["ref","createdAt","accountName","country","product","category","source","generatedBy","department","contact.name","contact.email","contact.phone","status","assignedTo","priority","meeting.aed","quote.aed","quote.no","order.aed","order.no","order.date","lost.reason"];
  const get=(o,p)=>p.split(".").reduce((a,k)=>a?.[k],o)??"";const q=v=>`"${String(v).replace(/"/g,'""')}"`;
  const csv=[cols.join(",")].concat(S.leads.slice().sort((a,b)=>a.ref<b.ref?-1:1).map(l=>cols.map(c=>q(get(l,c))).join(","))).join("\n");
  try{await S.downloads.save({filename:`lead-desk-${new Date().toISOString().slice(0,10)}.csv`,data:new Blob([csv],{type:"text/csv"})})}catch(e){if(e?.code!=="cancelled")toast("Export didn't complete")}}

/* ======================= 5. ACCOUNTS ======================= */
function renderAccts(m){const prods=prodList().filter(p=>!p.repeatable).map(p=>p.name);const q=S.acctQ;
  const accs=Object.values(allAccounts());let list=q?findAccounts(q,60):accs.sort((a,b)=>(b.live?1:0)-(a.live?1:0)||a.name.localeCompare(b.name)).slice(0,60);
  const cell=(a,p)=>{const ls=leadsFor(a.key).filter(l=>productsOf(l).includes(p));let c="",t="";
    if(ls.some(l=>l.status==="Won")){c="won";t="Won"}else if(ls.some(l=>OPEN.includes(l.status))){c="open";t="Open"}else if(a.hist?.[p]){c="hist";t="In 2026 sheet "+a.hist[p].r}else if(ls.some(l=>l.status==="Lost")){c="lost";t="Lost"}
    return`<td class="c">${c?`<span class="mx ${c}" title="${esc(t)}"></span>`:""}</td>`};
  m.innerHTML=`<section class="view"><div class="vhead"><div><h2>Accounts</h2><p>One row per property. ${fmtN(accs.length)} accounts, including ${fmtN(Object.keys(S.registry).length)} unique properties merged from the 2026 sheet. Empty cells show products not yet offered to that property.</p></div>
   <input id="acctQ" placeholder="Search accounts" value="${esc(q)}" style="max-width:280px"></div>
   <div class="legend"><span><i style="background:var(--ok)"></i>Won</span><span><i style="background:var(--accent)"></i>Open lead</span><span><i style="background:var(--warn)"></i>Logged in 2026 sheet</span><span><i style="background:var(--bad)"></i>Lost</span></div>
   <div class="tw matrix"><table><thead><tr><th>Account</th><th>Country</th>${prods.map(p=>`<th class="c" style="writing-mode:vertical-rl;transform:rotate(180deg);height:120px;padding:8px 4px;white-space:nowrap">${esc(p)}</th>`).join("")}</tr></thead><tbody>
   ${list.map(a=>`<tr><td style="white-space:nowrap">${esc(a.name)}${a.live?"":` <span class="chip">sheet</span>`}</td><td>${esc(a.country||"")}</td>${prods.map(p=>cell(a,p)).join("")}</tr>`).join("")||`<tr><td colspan="${prods.length+2}" class="empty">No accounts match.</td></tr>`}</tbody></table></div>
   <p class="small muted">Showing up to 60 accounts. Search to find a specific property.</p></section>`;
  const inp=$("#acctQ");inp.oninput=()=>{S.acctQ=inp.value;clearTimeout(inp.t);inp.t=setTimeout(()=>{render();const i=$("#acctQ");i.focus();i.setSelectionRange(i.value.length,i.value.length)},250)}}

/* ======================= 6. SETTINGS (editors) ======================= */
function renderSet(m){const st=S.settings;const prods=prodList(true),sps=spList(true);
  if(!isBO()){m.innerHTML=`<section class="view"><div class="vhead"><div><h2>Settings</h2><p>Products, sales engineers, sources, exchange rates and targets. Only back office can change these.</p></div></div>
   <div class="grid3"><div class="panel"><h3>Sales engineers</h3><p class="small">${spList().map(x=>esc(x.name)).join(", ")}</p></div><div class="panel"><h3>Products</h3><p class="small">${prodList().map(p=>esc(p.name)).join(", ")}</p></div><div class="panel"><h3>Sources</h3><p class="small">${st.sources.map(s=>esc(s.name)+" ("+s.cat+")").join(", ")}</p></div></div></section>`;return}
  const row=(x,i,kind)=>`<div class="it" style="padding:6px 0;border-bottom:1px solid var(--line)"><span style="flex:1;min-width:0;${x.active===false?"color:var(--muted);text-decoration:line-through":""}">${esc(x.name)}</span>
    ${kind==="p"?`<label class="small muted" style="display:flex;gap:4px;align-items:center"><input type="checkbox" data-rep="${i}" ${x.repeatable?"checked":""} style="width:auto">Repeatable</label>`:""}
    <span class="small muted" style="min-width:52px;text-align:right">${kind==="p"?useCount(x.name,"p"):useCount(x.name,"s")} leads</span>
    <button type="button" class="btn sm" data-tog="${kind}:${i}">${x.active===false?"Restore":"Retire"}</button></div>`;
  m.innerHTML=`<section class="view"><div class="vhead"><div><h2>Settings</h2><p>Back office manages the product catalog and sales engineer list here. Names must be unique, ignoring case and spacing. Retired names stay on existing leads but can no longer be chosen.</p></div></div>
  ${usersPanel()}
  <div class="grid2">
   <div class="panel"><h3>Product catalog <span class="chip">${prods.filter(p=>p.active!==false).length} active</span></h3>
     <form class="row" id="addProd" style="margin-bottom:6px"><input id="np" placeholder="New product name" style="flex:1"><label class="small muted" style="display:flex;gap:4px;align-items:center"><input type="checkbox" id="npRep" style="width:auto">Repeatable</label><button class="btn pri">Add product</button></form>
     <div id="npMsg"></div><p class="small muted" style="margin:4px 0 6px">Repeatable products, such as upgrades or renewals, can be sold again to an account that already has them.</p>
     <div class="listedit">${prods.map((x,i)=>row(x,i,"p")).join("")||`<p class="muted small">No products yet. Add the first one above.</p>`}</div></div>
   <div class="panel"><h3>Sales engineers <span class="chip">${sps.filter(x=>x.active!==false).length} active</span></h3>
     <form class="row" id="addSp" style="margin-bottom:6px"><input id="ns" placeholder="Full name, e.g. Shahbaz Rizvi" style="flex:1"><button class="btn pri">Add engineer</button></form>
     <div id="nsMsg"></div>
     <div class="listedit">${sps.map((x,i)=>row(x,i,"s")).join("")||`<p class="muted small">No sales engineers yet.</p>`}</div></div>
  </div>
  <form id="setForm" class="grid2" onsubmit="return false">
   <div class="panel"><h3>Source channels</h3><label class="f">One per line as “Name | Inbound” or “Name | Outbound”<textarea id="s-src" rows="10">${esc(st.sources.map(s=>s.name+" | "+s.cat).join("\n"))}</textarea></label></div>
   <div class="panel"><h3>Rates and targets</h3><div style="display:grid;gap:10px">
    <label class="f">Exchange rates to AED, one per line as “USD = 3.6725”<textarea id="s-fx" rows="5">${esc(Object.entries(st.fx).map(([k,v])=>k+" = "+v).join("\n"))}</textarea></label>
    <div class="grid2"><label class="f">Weekly lead target<input id="s-tg" type="number" value="${st.weeklyTarget}"></label><label class="f">Verify SLA (hours)<input id="s-sla" type="number" value="${st.slaVerifyHours}"></label>
    <label class="f">Days to first meeting<input id="s-cd" type="number" value="${st.slaContactDays}"></label><label class="f">Quote stale after (days)<input id="s-qd" type="number" value="${st.quoteStaleDays}"></label>
    <label class="f">Lead generator incentive %<input id="s-inc" type="number" step="0.1" value="${st.incentivePct}"></label>
    <label class="f">Departments (comma separated)<input id="s-dep" value="${esc(st.departments.join(", "))}"></label></div>
    <button class="btn pri" id="setSave" type="button">Save sources, rates and targets</button></div></div>
  </form></section>`;
  bindUsers();
  const save=async(body,okMsg)=>{try{await S.db.doc("config/settings").update(body);toast(okMsg);return true}catch(e){toast("Couldn't save: "+(e.code||e.message));return false}};
  const dupMsg=(el,list,name)=>{const n=name.trim().replace(/\s+/g," ");if(!n){el.innerHTML=`<div class="notice bad">Enter a name.</div>`;return null}
    const ex=list.find(x=>nk(x.name)===nk(n));if(ex){el.innerHTML=`<div class="notice bad">“${esc(ex.name)}” already exists${ex.active===false?" as a retired entry. Restore it instead":""}.</div>`;return null}
    const near=list.filter(x=>similar(keyOf(x.name),keyOf(n))>=0.8||nk(x.name).split(" ").includes(nk(n))||nk(n).split(" ").includes(nk(x.name)));
    if(near.length&&el.dataset.confirm!==nk(n)){el.dataset.confirm=nk(n);el.innerHTML=`<div class="notice warn">Close to ${near.map(x=>"“"+esc(x.name)+"”").join(", ")}. If this is a different ${list===sps?"person":"product"}, click Add again.</div>`;return null}
    el.innerHTML="";el.dataset.confirm="";return n};
  $("#addProd").onsubmit=async e=>{e.preventDefault();const n=dupMsg($("#npMsg"),prods,$("#np").value);if(!n)return;
    if(await save({products:prods.concat([{name:n,repeatable:$("#npRep").checked,active:true}])},"Added product "+n))render()};
  $("#addSp").onsubmit=async e=>{e.preventDefault();const n=dupMsg($("#nsMsg"),sps,$("#ns").value);if(!n)return;
    if(await save({salespeople:sps.concat([{name:n,active:true}])},"Added "+n))render()};
  m.querySelectorAll("[data-tog]").forEach(b=>b.onclick=async()=>{const[k,i]=b.dataset.tog.split(":");const list=(k==="p"?prods:sps).map(x=>Object.assign({},x));const it=list[+i];it.active=it.active===false;
    if(await save(k==="p"?{products:list}:{salespeople:list},(it.active?"Restored ":"Retired ")+it.name))render()});
  m.querySelectorAll("[data-rep]").forEach(c=>c.onchange=async()=>{const list=prods.map(x=>Object.assign({},x));list[+c.dataset.rep].repeatable=c.checked;await save({products:list},"Updated "+list[+c.dataset.rep].name)});
  $("#setSave").onclick=async()=>{const lines=id=>$("#"+id).value.split("\n").map(s=>s.trim()).filter(Boolean);
    const fx={};lines("s-fx").forEach(l=>{const[k,v]=l.split("=").map(s=>s.trim());if(k&&+v>0)fx[k.toUpperCase()]=+v});fx.AED=1;
    const sources=uniqList(lines("s-src").map(l=>{const[n,c]=l.split("|").map(s=>s.trim());return{name:n,cat:/out/i.test(c||"")?"Outbound":"Inbound"}}),x=>x);
    await save({sources,fx,weeklyTarget:+$("#s-tg").value||25,slaVerifyHours:+$("#s-sla").value||24,slaContactDays:+$("#s-cd").value||3,quoteStaleDays:+$("#s-qd").value||14,incentivePct:+$("#s-inc").value||0,
      departments:[...new Set($("#s-dep").value.split(",").map(s=>s.trim()).filter(Boolean))]},"Settings saved")}}
function usersPanel(){const mem=Object.entries(S.users);const mapped=new Set(mem.filter(([,u])=>u.engineer).map(([,u])=>nk(u.engineer)));
  return`<div class="panel"><div class="row" style="margin-bottom:6px"><h3>Users and access</h3><span class="chip">${mem.length+(window.LD_HOSTED?0:1)} users</span></div>
   <p class="small muted" style="margin:0 0 12px;max-width:80ch">${window.LD_HOSTED?"Only people on this list can sign in. Add their work email and role; they sign in with a link sent to that email. Sales engineers only ever see the leads assigned to their linked name.":"Only people on this list can use Lead Desk; everyone else sees an access-denied page. People sign in with their claude.ai account. In the page's Share menu, give back-office users <b>Editor</b> access and sales engineers and management <b>Contributor</b> access."}</p>
   <div class="grid3" style="align-items:end">
     <label class="f">Person<div class="ta"><input id="uq" placeholder="${window.LD_HOSTED?"Work email address":"Search by name or email"}" autocomplete="off" value="${esc(S.upick?.label||"")}"><div class="sugg" id="usugg" hidden></div></div></label>
     <label class="f">Role<select id="urole">${["sales","backoffice","management"].map(r=>`<option value="${r}"${(S.urole||"sales")===r?" selected":""}>${ROLE_LABEL[r]}</option>`).join("")}</select></label>
     <label class="f" id="uengWrap" ${(S.urole||"sales")==="sales"?"":"hidden"}>Linked sales engineer<select id="ueng">${opts(spNames().filter(n=>!mapped.has(nk(n))),"","Choose the engineer name")}</select></label>
   </div><div class="row" style="margin-top:10px"><button class="btn pri" id="uAdd" type="button">Add user</button><div id="uMsg" class="small"></div></div>
   <div class="tw" style="margin-top:14px"><table><thead><tr><th>Person</th><th>Role</th><th>Sales engineer</th><th></th></tr></thead><tbody>
    ${window.LD_HOSTED?"":`<tr><td>${S.isOwner?"You":"Page owner"} <span class="chip">Owner</span></td><td>Back office</td><td>${esc((S.users[S.uid]||{}).engineer&&S.isOwner?S.users[S.uid].engineer:"—")}</td><td></td></tr>`}
    ${mem.filter(([id])=>window.LD_HOSTED||!(S.isOwner&&id===S.uid)).map(([id,u])=>`<tr><td><span data-uid="${esc(id)}" data-fallback="Unknown user">${esc(S.names[id]||"")}</span><div class="small muted" data-mail="${esc(id)}"></div></td>
      <td><select data-urole="${esc(id)}" style="width:auto" ${id===S.uid?"disabled":""}>${["sales","backoffice","management"].map(r=>`<option value="${r}"${u.role===r?" selected":""}>${ROLE_LABEL[r]}</option>`).join("")}</select></td>
      <td>${u.role==="sales"?`<select data-ueng="${esc(id)}" style="width:auto">${opts(spNames().filter(n=>nk(n)===nk(u.engineer)||!mapped.has(nk(n))),u.engineer,"Not linked")}</select>`:`<span class="muted">—</span>`}</td>
      <td class="num">${id===S.uid?`<span class="small muted">You</span>`:`<button class="btn sm bad" data-urm="${esc(id)}">Remove</button>`}</td></tr>`).join("")}
   </tbody></table></div></div>`}
function bindUsers(){const inp=$("#uq"),sg=$("#usugg");if(!inp)return;
  fillNames();const ids=Object.keys(S.users);if(ids.length&&S.user)S.user.profiles(ids).then(ps=>ids.forEach(id=>{const e=document.querySelector(`[data-mail="${CSS.escape(id)}"]`);if(e&&ps[id]?.email)e.textContent=ps[id].email})).catch(()=>{});
  const show=async()=>{if(!S.user)return;const hits=await S.user.search(inp.value.trim());
    sg.innerHTML=hits.length?hits.map(h=>`<button type="button" data-pid="${esc(h.id)}"><span style="flex:1;min-width:0"><b></b> <span class="small muted"></span></span>${S.users[h.id]||h.id===S.uid&&S.isOwner?`<span class="chip">already added</span>`:""}</button>`).join(""):`<div class="small muted" style="padding:10px 12px">${window.LD_HOSTED?"Type the person's full work email address.":"No matching colleague. They must be in your claude.ai organization."}</div>`;
    hits.forEach((h,i)=>{const b=sg.querySelectorAll("button")[i];if(!b)return;b.querySelector("b").textContent=h.name;b.querySelector(".muted").textContent=h.email||"";b.dataset.label=h.name+(h.email?" · "+h.email:"")});sg.hidden=false};
  inp.onfocus=show;inp.oninput=()=>{S.upick=null;show()};
  sg.onclick=e=>{const b=e.target.closest("button[data-pid]");if(!b)return;S.upick={id:b.dataset.pid,label:b.dataset.label};inp.value=b.dataset.label;sg.hidden=true};
  $("#urole").onchange=e=>{S.urole=e.target.value;$("#uengWrap").hidden=S.urole!=="sales"};
  const saveUsers=async(members,msg)=>{try{await S.db.doc("config/users").set({members});S.users=members;S.upick=null;toast(msg);render();return true}catch(e){toast("Couldn't save users: "+(e.code||e.message)+(e.code==="invalid_argument"?" — you need Editor access":""));return false}};
  $("#uAdd").onclick=async()=>{const M=$("#uMsg");const role=$("#urole").value,eng=role==="sales"?$("#ueng").value:"";
    if(!S.upick){M.innerHTML=`<span style="color:var(--bad)">Search for the person and pick them from the list.</span>`;return}
    if(S.users[S.upick.id]||(S.isOwner&&S.upick.id===S.uid)){M.innerHTML=`<span style="color:var(--bad)">This person is already a user. Change their role in the table.</span>`;return}
    if(role==="sales"&&!eng){M.innerHTML=`<span style="color:var(--bad)">Choose which sales engineer name this login belongs to.</span>`;return}
    const members=Object.assign({},S.users,{[S.upick.id]:{role,engineer:eng,addedAt:nowISO(),addedBy:S.uid}});
    if(await saveUsers(members,"Added "+S.upick.label.split(" · ")[0])){S.upick=null;S.urole=role}};
  document.querySelectorAll("[data-urole]").forEach(sel=>sel.onchange=()=>{const id=sel.dataset.urole;const m=Object.assign({},S.users);m[id]=Object.assign({},m[id],{role:sel.value,engineer:sel.value==="sales"?m[id].engineer||"":""});saveUsers(m,"Role updated")});
  document.querySelectorAll("[data-ueng]").forEach(sel=>sel.onchange=()=>{const id=sel.dataset.ueng;const m=Object.assign({},S.users);m[id]=Object.assign({},m[id],{engineer:sel.value});saveUsers(m,"Engineer link updated")});
  document.querySelectorAll("[data-urm]").forEach(b=>b.onclick=()=>{if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Confirm remove";return}const m=Object.assign({},S.users);delete m[b.dataset.urm];saveUsers(m,"User removed")})}
function useCount(name,kind){return S.leads.filter(l=>kind==="p"?productsOf(l).includes(name):l.assignedTo===name).length}

if(window.LD_HOSTED){window.__startApp=boot;if(window.__ldReady)boot()}else boot();
</script>
