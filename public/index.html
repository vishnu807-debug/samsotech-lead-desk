<style>

  --inb:#3FC2B8; --inb-soft:#14302E; --outb:#E8A54B; --outb-soft:#372815;
  --ok:#5BC97A; --ok-soft:#16301F; --warn:#E5B04F; --warn-soft:#352914; --bad:#F27B70; --bad-soft:#3A1C1A;

  --bg:#0E131A; --surface:#161D26; --sunk:#1D2631; --ink:#E5EAF1; --muted:#97A4B5; --line:#2A3542;
  --accent:#6EA4EE; --accent-ink:#0B1420; --accent-soft:#1D2E45;

/* ===== Finish layer (Nov 2026): navigation, states, rhythm. Colours and layout come from the tokens above. ===== */
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
:root{--ring:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent);--e1:0 1px 2px rgba(20,33,49,.05);--e2:0 6px 20px rgba(20,33,49,.10)}
:root[data-theme="dark"]{--e1:0 1px 2px rgba(0,0,0,.35);--e2:0 8px 24px rgba(0,0,0,.5)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--e1:0 1px 2px rgba(0,0,0,.35);--e2:0 8px 24px rgba(0,0,0,.5)}}
/* navigation */
header.top{box-shadow:var(--e1)}
nav.tabs{overflow:visible;align-items:center}
nav.tabs button{border-radius:8px;transition:background .12s,color .12s}
nav.tabs button[aria-selected="true"]{font-weight:600}
nav.tabs button:active{transform:translateY(.5px)}
.mtw{position:relative;flex:none}
.mtw>.mt{color:var(--ink)}.mtw>.mt svg{opacity:.7;transition:transform .15s}.mtw>.mt[aria-expanded="true"]{background:var(--sunk)}.mtw>.mt[aria-expanded="true"] svg{transform:rotate(180deg)}
.mtp{position:absolute;right:0;top:calc(100% + 8px);z-index:30;display:grid;gap:2px;min-width:220px;max-width:calc(100vw - 32px);padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--e2)}
.mtp button{justify-content:space-between;width:100%;padding:10px 12px!important;font-size:14px!important;color:var(--ink)!important}
.mtp button[aria-selected="true"]{color:var(--accent)!important}
@media (prefers-reduced-motion:no-preference){.mtp:not([hidden]){animation:pop .12s ease-out}@keyframes pop{from{opacity:0;transform:translateY(-4px)}}}
@media (max-width:760px){nav.tabs{scroll-snap-type:none;padding-bottom:4px}.mtw{margin-left:auto}.mtp{min-width:240px}.mtp button{padding:12px 14px!important;font-size:15px!important}}
/* sub-tabs: soft edge shows there is more to scroll to */
.mtabs{scroll-behavior:smooth}
.mtabs.fr{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 44px),transparent)}
.mtabs.fl{-webkit-mask-image:linear-gradient(270deg,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(270deg,#000 calc(100% - 44px),transparent)}
.mtabs.fl.fr{-webkit-mask-image:linear-gradient(90deg,transparent,#000 44px,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(90deg,transparent,#000 44px,#000 calc(100% - 44px),transparent)}
.mtabs button{transition:color .12s,border-color .12s}.mtabs button[aria-selected="true"]{font-weight:600}
/* surfaces */
.panel,.kpi,.tw{box-shadow:var(--e1)}.panel{border-radius:12px}.kpi{border-radius:12px}
.panel .panel,.panel .kpi,.panel .tw,.drawer .tw{box-shadow:none}
.kpi .l{letter-spacing:.07em}.kpi .v{letter-spacing:-.01em;line-height:1.15;margin-top:6px}.kpi .s{margin-top:2px}
.vhead h2{letter-spacing:-.01em}
/* controls: hover, press, focus, disabled */
.btn{transition:background .12s,border-color .12s,box-shadow .12s,transform .06s;box-shadow:var(--e1)}
.btn:hover{border-color:color-mix(in srgb,var(--ink) 24%,var(--line))}
.btn:active:not([disabled]){transform:translateY(1px);box-shadow:none}
.btn.pri{box-shadow:0 1px 2px color-mix(in srgb,var(--accent) 40%,transparent)}.btn.pri:hover{border-color:var(--accent)}
.btn.bad:hover{background:var(--bad-soft)}
.btn[disabled]{box-shadow:none}
input,select,textarea{transition:border-color .12s,box-shadow .12s}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--ink) 28%,var(--line))}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:var(--ring)}
input::placeholder,textarea::placeholder{color:color-mix(in srgb,var(--muted) 75%,transparent)}
input[disabled],select[disabled],textarea[disabled]{background:var(--sunk);color:var(--muted);cursor:not-allowed}
input[type=checkbox],input[type=radio]{accent-color:var(--accent)}
.seg{width:fit-content;max-width:100%;justify-self:start}
.seg button{transition:background .12s,color .12s}.seg button:not([aria-pressed="true"]):hover{background:var(--sunk);color:var(--ink)}
.pchk{transition:border-color .12s,background .12s}.pchk:not(.blocked):hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
/* tables */
tbody tr{transition:background .1s}
.tw tbody tr:hover{background:color-mix(in srgb,var(--sunk) 55%,transparent)}
tbody tr.click:hover{background:var(--accent-soft)}
th{position:relative}
.empty{padding:36px 20px}
/* badges in dark mode: dark text on the light red, readable */
:root[data-theme="dark"] .count:not(.n),:root[data-theme="dark"] .chip.newl{color:#2a0f0c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .count:not(.n),:root:not([data-theme="light"]) .chip.newl{color:#2a0f0c}}
/* thin, quiet scrollbars inside the app */
.tw,.drawer,.sugg,.board{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
::selection{background:color-mix(in srgb,var(--accent) 28%,transparent)}
/* phone */
.aftog{display:none}
@media (max-width:760px){
 main{padding-block:16px 48px}.view{gap:14px}.panel{padding:14px}
 .vhead{align-items:flex-start}.vhead h2{font-size:20px}
 .btn{padding:10px 14px}.btn.sm{padding:7px 11px}
 input,select,textarea{font-size:16px;padding:9px 12px}.fgrid select,.fgrid input{height:44px}input[type=checkbox],input[type=radio]{padding:0}
 .kpis,.kpis.k7,.kpis.k5{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kpi{padding:12px 14px}.kpi .v,.kpis.k7 .v,.kpis.k5 .v{font-size:22px}
 .aftog{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;padding:2px 0;font:600 14px var(--f-body);color:var(--ink);cursor:pointer}
 .panel.afbar.afc>.fgrid{display:none}.panel.afbar:not(.afc)>.aftog{margin-bottom:8px}
 .alerts .alert{flex-wrap:wrap;row-gap:4px}.alerts .alert>span[style*="flex:1"]{flex-basis:calc(100% - 110px)!important}
 .toast{left:16px;right:16px;transform:none;max-width:none;text-align:center}
 .listedit .it{flex-wrap:wrap;min-width:0}.listedit .it>*{min-width:0}.listedit .it input,.listedit .it select{flex:1 1 140px}
}
</style>

function keyOf(n){let s=String(n||"").toLowerCase().replace(/&/g," and ").replace(/[^a-z0-9 ]/g," ");
  const t=s.split(/\s+/).filter(w=>w&&!STOP.has(w));let k=t.join("-").slice(0,120);

function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m||!n)return m||n;let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function similar(k1,k2){if(!k1||!k2)return 0;if(k1===k2)return 1;
  const A=new Set(k1.split("-")),B=new Set(k2.split("-"));let inter=0;A.forEach(x=>B.has(x)&&inter++);
  const jac=inter/(A.size+B.size-inter);const lr=1-lev(k1,k2)/Math.max(k1.length,k2.length);
  const contains=(k1.length>5&&k2.includes(k1))||(k2.length>5&&k1.includes(k2))?0.8:0;return Math.max(jac,lr,contains)}

  for(const[k,a]of Object.entries(S.accounts))if(a.deleted){if(a.mergedInto&&m[a.mergedInto])m[a.mergedInto].hist=Object.assign({},S.registry[k]?.p||{},m[a.mergedInto].hist||{});delete m[k]}
  return m}

const normTxt=x=>String(x||"").toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/&/g," and ").replace(/[^a-z0-9]+/g," ").trim();
function findAccounts(q,limit=8,withPlace){const nq=normTxt(q);if(nq.length<2)return[];const k=keyOf(q);const qt=nq.split(" ");const out=[];
  for(const a of Object.values(allAccounts())){const nn=normTxt(a.name);const words=(withPlace?nn+" "+normTxt(a.country)+" "+normTxt(a.city):nn).split(" ");let s=0;
    if(a.key===k||nn===nq)s=1;else if(nn.startsWith(nq))s=.96;else if(qt.every(t=>words.some(w=>w.startsWith(t))))s=.92;else if(nn.includes(nq))s=.88;
    else if(nq.length>=5){const f=similar(k,a.key);if(f>=.78)s=f*.85}
    if(s)out.push([s,a])}
  out.sort((x,y)=>y[0]-x[0]||x[1].name.localeCompare(y[1].name));
  return out.sort((x,y)=>y[0]-x[0]).slice(0,limit).map(x=>Object.assign({score:x[0]},x[1]))}

function productState(key,product,exceptId){const pdef=prodList(true).find(p=>p.name===product)||{};
  if(pdef.repeatable)return{state:"ok"};
  const live=leadsFor(key).filter(l=>l.id!==exceptId&&productsOf(l).includes(product)&&BLOCKING.includes(l.status));
  if(live.length){const l=live[0];return{state:"blocked",lead:l,msg:`${l.status==="Won"?"Already won":"Open"} · ${l.ref}${l.assignedTo?" · "+l.assignedTo:""}`}}
  const ext=(S.extLocks[key]||[]).find(r=>r.product===product&&r.ref!==exceptId&&BLOCKING.includes(r.status));
  if(ext)return{state:"blocked",lead:{id:ext.ref,ref:ext.ref,status:ext.status,assignedTo:ext.assigned_to},msg:`${ext.status==="Won"?"Already won":"Open"} · ${ext.ref}${ext.assigned_to?" · "+ext.assigned_to:""}`};
  const h=histOf(key)[product];
  if(h)return{state:"hist",msg:`In 2026 sheet · ${h.r}${h.e?" · "+h.e:""}`};
  return{state:"ok"}}

function exportName(F,ext){const p=["Leads"];if(F.cat!=="All")p.push(F.cat);if(F.source)p.push(F.source);if(F.dept)p.push(F.dept);if(F.sub)p.push(F.sub.replace(" (all)","").replace(" · ","_"));if(F.eng)p.push(F.eng);if(F.region)p.push(F.region);if(F.status!=="All")p.push(F.status);

function exportRows(ls){const d=v=>v?new Date(String(v).length===10?v+"T12:00:00":v):null;

  s.onload=()=>window.XLSX?res(window.XLSX):rej(new Error("Excel library didn't load"));s.onerror=()=>{XLSX_P=null;rej(new Error("Couldn't load the Excel library. Check your internet connection or use CSV."))};document.head.appendChild(s)}))}
async function exportLeads(fmt){if(!can("lead.export")){toast("Your role can't export leads.");return}const F=lf();const b=$("#lfX");const label=b?.textContent;

      blob=new Blob(["﻿"+[H.map(h=>q(h[0])).join(",")].concat(rows.map(r=>r.map(q).join(","))).join("\r\n")],{type:"text/csv;charset=utf-8"})}

/* ======================= ANALYTICS (one calculation shared by Accounts and Management) =======================
   Source of truth: the leads table only. Definitions used everywhere:
   - Lead in scope: not Duplicate/Rejected, visible to this user (own leads for Sales), received (requirement date) inside the period.
   - Order closed: lead status Won. Revenue: its order value in AED (falls back to the quoted/meeting value, as elsewhere in Lead Desk).

   - Engineer: the lead's assigned engineer. An engineer's accounts: distinct properties with at least one of their leads.

const AF_DEF={period:"ytd",from:"",to:"",region:"",sub:"",eng:"",src:"All",status:""};

function productData(){const AF=af();const P=pvState();const custKeys=new Set(S.leads.filter(l=>l.status==="Won").map(accKey));

  const reached=(l,s)=>!!l.stageAt?.[s]||(s==="Meeting Done"?reachedMeeting(l):s==="Quotation Sent"?!!l.quote:false);
  for(const l of ls)for(const p of pbProdsOf(l)){if(q&&!nk(p).includes(q))continue;const sh=pbShare(l,p);const o=G[p]||(G[p]={name:p,leads:[],n:0,open:0,meet:0,quoted:0,quotedV:0,won:0,rev:0,lost:0,hold:0,pipe:0,upRev:0,shared:0});
    o.leads.push(l);o.n++;if(OPEN.includes(l.status)&&l.status!=="On Hold")o.open++;if(reached(l,"Meeting Done"))o.meet++;if(l.quote&&+l.quote.aed>0){o.quoted++;o.quotedV+=+l.quote.aed*sh}
    if(l.status==="Won"){o.won++;o.rev+=orderVal(l)*sh;if(isUpsell(l))o.upRev+=orderVal(l)*sh}if(l.status==="Lost")o.lost++;if(l.status==="On Hold")o.hold++;

  const inc=ls.filter(l=>!q||productsOf(l).some(p=>nk(p).includes(q)));const wonL=inc.filter(l=>l.status==="Won");
  const tot={n:inc.length,open:inc.filter(l=>OPEN.includes(l.status)&&l.status!=="On Hold").length,meet:inc.filter(l=>reached(l,"Meeting Done")).length,quoted:inc.filter(l=>l.quote&&+l.quote.aed>0).length,quotedV:inc.reduce((s,l)=>s+(l.quote&&+l.quote.aed>0?+l.quote.aed:0),0),
    won:wonL.length,rev:wonL.reduce((s,l)=>s+orderVal(l),0),lost:inc.filter(l=>l.status==="Lost").length,hold:inc.filter(l=>l.status==="On Hold").length,pipe:inc.filter(l=>["Meeting Done","Quotation Sent"].includes(l.status)).reduce((s,l)=>s+leadValue(l),0),upRev:wonL.filter(isUpsell).reduce((s,l)=>s+orderVal(l),0)};

/* ======================= FOCUS: activity rules, forecast, growing clients =======================
   1. Activity rules: first contact within N working days, first meeting within N days, every open lead has a next step,
      nothing goes quiet for more than N days. Applies to leads assigned on or after the rules' start date.
   2. Forecast: each deal is Commit, Best case, Pipeline or Omit for a month. The commit "as of" the cut-off day of the
      month is compared with what closed, so forecast accuracy is measured per engineer.
   3. Grow clients: cross-sell targets (client hotels × products they don't have), chain owners, reference sites. */
const RULE_DEF={contactDays:2,meetingDays:14,staleDays:14,from:"2026-11-01",cutoff:5};
const PROB_DEF={"Assigned":10,"Meeting Done":25,"Quotation Sent":50,"On Hold":10};
const FC_CATS=[["commit","Commit"],["best","Best case"],["pipeline","Pipeline"],["omit","Omit"]];
const FC_LABEL=Object.fromEntries(FC_CATS);

const rules=()=>Object.assign({},RULE_DEF,S.settings.rules||{});
const stageProb=()=>Object.assign({},PROB_DEF,S.settings.stageProb||{});
function workDaysBetween(a,b){let d=new Date(a);d.setHours(0,0,0,0);const e=new Date(b);e.setHours(0,0,0,0);let n=0;let g=0;while(d<e&&g++<4000){d.setDate(d.getDate()+1);const w=d.getDay();if(w!==0&&w!==6)n++}return n}   // Mon–Fri
const assignedOn=l=>l.assignedAt||l.verifiedAt||l.createdAt||"";
function firstTouch(l){const t=(l.contacts||[]).map(c=>c.at).concat(meetingsOf(l).map(m=>m.date)).filter(Boolean).sort();return t[0]||""}
function lastTouch(l){const t=(l.contacts||[]).map(c=>c.at).concat(meetingsOf(l).map(m=>m.date),[l.quote?.date,l.lastFollowUpDone,l.stageAt?.["Meeting Done"],l.stageAt?.["Quotation Sent"],assignedOn(l)]).filter(Boolean).sort();return t[t.length-1]||""}
function ruleFlags(l){if(l.deleted||!RULED.includes(l.status)||!l.assignedTo)return[];const R=rules();const at=assignedOn(l);if(!at||at.slice(0,10)<R.from)return[];
  const F=[],now=new Date(),wd=workDaysBetween(at,now);
  if(l.status==="Assigned"&&!firstTouch(l)&&wd>R.contactDays)F.push({k:"contact",t:`No contact ${wd} working days after assignment (target ${R.contactDays})`,s:"No contact"});
  if(l.status==="Assigned"&&!meetingsOf(l).length){const d=Math.floor(days(at));if(d>R.meetingDays)F.push({k:"meeting",t:`No meeting ${d} days after assignment (target ${R.meetingDays})`,s:"No meeting"})}
  if(!l.nextFollowUp){if(wd>R.contactDays||firstTouch(l))F.push({k:"next",t:"No next step scheduled",s:"No next step"})}else if(fuOverdue(l))F.push({k:"overdue",t:`Next step overdue (${fuLabel(l)})`,s:"Next step overdue"});
  const sd=Math.floor(days(lastTouch(l)));if(sd>R.staleDays)F.push({k:"stale",t:`No activity for ${sd} days (limit ${R.staleDays})`,s:`Quiet ${sd}d`});
  return F}
const flagChips=l=>ruleFlags(l).map(f=>`<span class="late" title="${esc(f.t)}">${esc(f.s)}</span>`).join("");

function nextDefault(){const d=new Date();let n=0;while(n<2){d.setDate(d.getDate()+1);if(d.getDay()!==0&&d.getDay()!==6)n++}d.setHours(10,0,0,0);return localInput(d)}

const cutoffISO=m=>new Date(`${m}-${String(rules().cutoff).padStart(2,"0")}T23:59:59`).toISOString();
function commitAt(l,m){const c=cutoffISO(m);const h=(l.forecastHist||[]).filter(x=>x.at<=c);const x=h[h.length-1];return x&&x.cat==="commit"&&x.month===m?(+x.amt||leadValue(l)):0}
function forecastFor(ls,m){const P=stageProb();const R={};const row=e=>R[e]||(R[e]={e,commit:0,best:0,weighted:0,n:0});
  ls.filter(l=>!l.deleted&&RULED.concat(["On Hold"]).includes(l.status)).forEach(l=>{const f=fcOf(l);if(f.cat==="omit")return;const mm=f.month||ymKey(l.quote?.targetDate);if(mm!==m)return;const v=leadValue(l);const r=row(l.assignedTo||"Unassigned");r.n++;
    if(f.cat==="commit"){r.commit+=v;r.best+=v}else if(f.cat==="best")r.best+=v;r.weighted+=v*(P[l.status]||0)/100});
  ls.filter(l=>l.status==="Won"&&ymKey(wonAt(l))===m).forEach(l=>{const r=row(l.assignedTo||"Unassigned");r.won=(r.won||0)+orderVal(l)});
  return Object.values(R).sort((a,b)=>b.commit-a.commit||b.best-a.best||b.weighted-a.weighted)}
function accuracy(ls,m){const R={};const row=e=>R[e]||(R[e]={e,committed:0,closed:0,won:0,n:0,nWon:0});
  ls.forEach(l=>{const c=commitAt(l,m);if(c){const r=row(l.assignedTo||"Unassigned");r.committed+=c;r.n++;if(l.status==="Won"&&ymKey(wonAt(l))===m){r.closed+=orderVal(l);r.nWon++}}
    if(l.status==="Won"&&ymKey(wonAt(l))===m)row(l.assignedTo||"Unassigned").won+=orderVal(l)});
  return Object.values(R).filter(r=>r.committed||r.won).sort((a,b)=>b.committed-a.committed||b.won-a.won)}
function forecastPanel(){const F=S.fcv||(S.fcv={m:ymKey(todayISO()),acc:addMonths(ymKey(todayISO()),-1)});const ls=S.leads;const rows=forecastFor(ls,F.m);const T=rows.reduce((o,r)=>({c:o.c+r.commit,b:o.b+r.best,w:o.w+r.weighted,won:o.won+(r.won||0)}),{c:0,b:0,w:0,won:0});
  const accM=[1,2,3,4,5,6].map(i=>addMonths(ymKey(todayISO()),-i));const A=accuracy(ls,F.acc);const AT=A.reduce((o,r)=>({c:o.c+r.committed,cl:o.cl+r.closed,w:o.w+r.won}),{c:0,cl:0,w:0});const P=stageProb();
  const pc=v=>v==null?"—":Math.round(v*100)+"%";
  return`<div class="panel" id="fcPanel"><div class="row" style="margin-bottom:6px"><h3>Forecast</h3><span class="sp"></span><label class="f fsm" style="min-width:160px">Month<select id="fcM">${fcMonths().map(m=>`<option value="${m}"${m===F.m?" selected":""}>${ymLabel(m)}</option>`).join("")}</select></label></div>
   <p class="small muted" style="margin:0 0 10px">Each engineer marks their deals Commit or Best case in the Focus tab. Weighted pipeline = deal value × stage probability (${Object.entries(P).map(([k,v])=>k+" "+v+"%").join(", ")}). Deals without a forecast month use the quotation target date.</p>
   <div class="kpis" style="margin-bottom:10px"><div class="kpi"><div class="l">Commit</div><div class="v">${fmtAED(T.c)}</div></div><div class="kpi"><div class="l">Best case</div><div class="v">${fmtAED(T.b)}</div><div class="s">includes commit</div></div><div class="kpi"><div class="l">Weighted pipeline</div><div class="v">${fmtAED(T.w)}</div></div><div class="kpi"><div class="l">Won so far</div><div class="v">${fmtAED(T.won)}</div><div class="s">${ymLabel(F.m)}</div></div></div>
   <div class="tw"><table><thead><tr><th>Engineer</th><th class="num">Deals</th><th class="num">Commit</th><th class="num">Best case</th><th class="num">Weighted</th><th class="num">Won so far</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${esc(r.e)}</td><td class="num">${r.n}</td><td class="num">${r.commit?fmtAED(r.commit):"—"}</td><td class="num">${r.best?fmtAED(r.best):"—"}</td><td class="num">${r.weighted?fmtAED(r.weighted):"—"}</td><td class="num">${r.won?fmtAED(r.won):"—"}</td></tr>`).join("")||`<tr><td colspan="6" class="empty">No deals forecast for ${ymLabel(F.m)}.</td></tr>`}</tbody>

   <div class="row" style="margin:16px 0 6px"><h3>Forecast accuracy</h3><span class="sp"></span><label class="f fsm" style="min-width:160px">Month<select id="fcA">${accM.map(m=>`<option value="${m}"${m===F.acc?" selected":""}>${ymLabel(m)}</option>`).join("")}</select></label></div>

   <div class="tw"><table><thead><tr><th>Engineer</th><th class="num">Committed</th><th class="num">Closed from commit</th><th class="num">Accuracy</th><th class="num">All orders won</th></tr></thead><tbody>

function rulesTeam(ls){const R=rules();const E={};const row=e=>E[e]||(E[e]={e,n:0,contacted:0,contactedOK:0,met:0,metOK:0,noNext:0,stale:0,overdue:0,flagged:0,ttc:[]});

/* ======================= PRICE BOOK AND QUOTE-LINE LEARNING (Management → Price book) =======================
   config/pricebook = {items:[{id,product,name,type,unit,yearly,pms,iface,cur,active,v:[{on,re,min,bands,from,st,by,at,okBy,okAt}]}]}
     type: software | hardware | interface | service · unit: pc | user | property | unit | once | room
     each price change is a new version (st "draft"); Management or a Supervisor approves it (st "ok").
   config/linerules = {rules:[{id,key,it,by,at,on}]}: quote wording → price item, applied automatically next time.
   Quote lines carry m = {it, st:"auto"|"ok"|"wait", by, at}; it = item id, "x:discount" or "x:other".
   Permissions: pricing.view (see prices), pricing.approve (approve prices and lines, teach rules), pricing.manage (edit).
   Database: 21_pricing.sql hides the price book from everyone else and lets approvers change only approval fields. */
const PB_UNITS={pc:"Per front-desk PC",user:"Per user",property:"Per property",unit:"Per unit",once:"One-time per property",room:"Per room, yearly minimum"};
const PB_TYPES={software:"Software",hardware:"Hardware",interface:"Interface",service:"Service"};
const PB_X={"x:discount":"Not a product: discount","x:other":"Not a product: freight, VAT, travel…"};
const canPB=()=>can("pricing.view")||can("pricing.approve")||can("pricing.manage");
const pbAll=()=>(S.pb&&Array.isArray(S.pb.items))?S.pb.items:[];
const pbItems=()=>pbAll().filter(i=>i.active!==false);
const pbItem=id=>pbAll().find(i=>i.id===id);
const pbKey=s=>String(s||"").toLowerCase().replace(/scanning/g,"scanner").replace(/[^a-z0-9&]+/g," ").trim();
const pbRules=()=>((S.lr&&S.lr.rules)||[]).filter(r=>r.on!==false);

function pbVer(it,date){const d=String(date||todayISO()).slice(0,10);const vs=(it&&it.v||[]).filter(v=>v.st==="ok"&&(v.from||"")<=d);
  vs.sort((a,b)=>(a.from||"").localeCompare(b.from||"")||(a.okAt||a.at||"").localeCompare(b.okAt||b.at||""));return vs[vs.length-1]||null}
const pbDraft=it=>(it.v||[]).find(v=>v.st==="draft")||null;
const pbBandsTxt=b=>(b||[]).map(([to,r])=>(to>=99999?"*":to)+":"+r).join(", ");
function pbBandsParse(t){t=String(t||"").trim();if(!t)return[];const out=[];for(const p of t.split(/[,;\n]+/)){const m=p.trim().match(/^(\*|\d+)\s*[:=]\s*(\d+(?:\.\d+)?)$/);if(!m)return null;out.push([m[1]==="*"?99999:+m[1],+m[2]])}return out.sort((a,b)=>a[0]-b[0])}
const pbRate=(v,rooms)=>{const b=v.bands||[];for(const [to,r] of b)if(rooms<=to)return r;return b.length?b[b.length-1][1]:+v.on||0};
/* standard amount for one item: {amt (AED), note} or null when there is no approved price */
function pbStd(it,qty,ctx){const v=pbVer(it,ctx.date);if(!v)return null;const remote=/remote/i.test(ctx.mode||"");const price=remote&&v.re!=null&&v.re!==""?+v.re:+v.on||0;const cur=it.cur||"AED";
  if(it.unit==="room"){const r=+ctx.rooms||0;const rate=pbRate(v,r);const raw=r*rate;const amt=Math.max(+v.min||0,raw);
    return{amt:toAED(amt,cur),note:r?`${fmtN(r)} rooms × ${fmtN(rate)} = ${fmtN(raw)}${raw<(+v.min||0)?` → yearly minimum ${fmtN(+v.min)}`:""}`:`rooms not recorded → yearly minimum ${fmtN(+v.min||0)}`}}
  if(it.unit==="once")return{amt:toAED(price,cur),note:"one-time per property"};
  return{amt:toAED(price*(+qty||1),cur),note:""}}
/* effective mapping of a quote line: saved approval, else a rule, else nothing */
function pbMapOf(x){if(x&&x.m&&x.m.st&&x.m.st!=="wait"&&x.m.it)return x.m;const k=pbKey(x&&x.item);const r=k&&pbRules().find(r=>r.key===k);return r?Object.assign({it:r.it,st:"auto",rule:r.id},r.ty?{ty:r.ty,un:r.un,yr:r.yr,pr:r.pr,if:r.if,nm:r.nm}:{}):null}
function pbMapLines(lines){return(lines||[]).map(x=>{if(x.m&&x.m.st==="ok")return x;const m=pbMapOf(Object.assign({},x,{m:null}));return Object.assign({},x,{m:m||{st:"wait"}})})}

/* revenue share of a product on a lead: by approved lines; leads without matched lines split equally */
function pbShares(l){if(l._pbs&&l._pbs.k===S.pbStamp)return l._pbs.v;const ps=productsOf(l);const lines=(l.quote&&l.quote.lines)||[];const by={};let tot=0,extra=0;
  for(const x of lines){const m=pbMapOf(x);const t=Math.max(0,+x.total||0);if(!m||String(m.it).startsWith("x:")||!t)continue;const it=pbItem(m.it);if(!it)continue;
    if(it.product==="PMS interface"||it.product==="Services"){extra+=t;continue}by[it.product]=(by[it.product]||0)+t;tot+=t}
  let v;if(tot>0){v={};Object.keys(by).forEach(p=>v[p]=by[p]/tot)}else{v={};ps.forEach(p=>v[p]=1/Math.max(1,ps.length))}
  try{Object.defineProperty(l,"_pbs",{value:{k:S.pbStamp,v},configurable:true,enumerable:false,writable:true})}catch(e){}return v}

function pbSuggest(x){const k=pbKey(x.item);if(/\bdiscount\b/.test(k))return"x:discount";if(/\b(freight|shipping|vat|travel|courier)\b/.test(k))return"x:other";
  const W=new Set(k.split(" ").filter(w=>w.length>2));let best="",bs=0;

function pbLeadRows(l){const q=l.quote||{};const lines=Array.isArray(q.lines)?q.lines:[];const cur=q.currency||"AED";const ctx={date:q.date,rooms:l.rooms,mode:l.implMode||q.mode||""};const seen=new Set();

/* ======================= RECURRING REVENUE AND RENEWALS (Renewals tab) =======================
   What a won order brings in from the 2nd year: AMC, annual subscription, and OHIP (noted separately: it is paid on
   to the PMS vendor, so it is neither AMC nor part of the Sales share).
   settings.amc = {rates:[{scope:"std"|"region"|"chain",key,product|"*",pct}], startMonths, salesShare, alertDays, subProducts}
     AMC % applies to the order value of hardware, software licences and one-time PMS interface lines.
     Rate used: hotel chain, else region, else standard. Sales share = % of subscription from year 2, every year.
   Amounts come from the order's matched quotation lines (line meta m.ty/un/yr/pr/if, or the price book);
   orders without lines are estimated from the order value and marked "estimated".
   lead.renewals["amc-2"|"sub-3"|"ohip-2"…] = {st, amt (corrected yearly amount), notes:[{t,by,a}], by, at},
   written through set_renewal() (24_amc_renewals.sql): AMC team (renewal.manage) or the order's own engineer. */
const amcCfg=()=>Object.assign({rates:[],startMonths:12,salesShare:null,alertDays:[90,60,30],subProducts:[]},S.settings.amc||{});

  const grp=(keyF,src)=>{const g={};(src||valid).forEach(l=>{const ks=[].concat(keyF(l)||"—");ks.forEach(k=>{const o=g[k]||(g[k]={n:0,meet:0,quote:0,won:0,wonV:0,pipe:0,lost:0});o.n++;if(has(l,"Meeting Done"))o.meet++;if(has(l,"Quotation Sent"))o.quote++;if(l.status==="Won"){o.won++;o.wonV+=leadValue(l)}if(l.status==="Lost")o.lost++;if(["Meeting Done","Quotation Sent"].includes(l.status))o.pipe+=leadValue(l)})});return Object.entries(g).sort((a,b)=>b[1].wonV-a[1].wonV||b[1].n-a[1].n)};
  const cat={Inbound:{n:0,v:0,w:0},Outbound:{n:0,v:0,w:0}};S.leads.filter(inPeriod).filter(inReg).filter(l=>!["Duplicate","Rejected"].includes(l.status)).forEach(l=>{const c=cat[l.category]||cat.Inbound;c.n++;if(l.status==="Won"){c.w++;c.v+=leadValue(l)}});
  const rep={};valid.filter(l=>l.assignedTo).forEach(l=>{const o=rep[l.assignedTo]||(rep[l.assignedTo]={a:0,open:0,stale:0,meet:0,quote:0,won:0,v:0,lost:0,ttq:[]});o.a++;if(OPEN.includes(l.status))o.open++;
    if(l.status==="Assigned"&&days(l.assignedAt)>(S.settings.slaContactDays||3))o.stale++;if(has(l,"Meeting Done"))o.meet++;if(has(l,"Quotation Sent")){o.quote++;o.ttq.push((new Date(l.stageAt["Quotation Sent"])-new Date(l.assignedAt||l.createdAt))/864e5)}if(l.status==="Won"&&engCredit(l)){o.won++;o.v+=leadValue(l)}if(l.status==="Lost")o.lost++});

   ${tgtPanel(valid)}

/* ---------- merge or delete a duplicate account (back office) ---------- */
function likelyDuplicates(a,limit=6){const n=normTxt(a.name);if(n.length<3)return[];const out=[];const A=allAccounts();
  for(const b of Object.values(A)){if(b.key===a.key)continue;const m=normTxt(b.name);if(!m)continue;let sc=0;
    if(m===n)sc=1;else if(m.startsWith(n+" ")||n.startsWith(m+" "))sc=.9;else if(m.slice(0,3)===n.slice(0,3)&&Math.abs(m.length-n.length)<8){const f=similar(a.key,b.key);if(f>=.82)sc=f}
    if(sc&&(!a.country||!b.country||sc>=.95||normTxt(a.country)===normTxt(b.country)||guessRegion(a.country)===guessRegion(b.country)))out.push([sc,b])}
  return out.sort((x,y)=>y[0]-x[0]).slice(0,limit).map(x=>x[1])}
function openMerge(key){S.merge={key,target:null,armed:null,q:""};drawMerge()}
function closeMerge(){S.merge=null;$("#drawerHost").innerHTML=""}
function drawMerge(){const mg=S.merge;if(!mg)return;const A=allAccounts();const a=A[mg.key];if(!a){closeMerge();return}
  const ls=leadsFor(a.key);const hist=Object.keys(a.hist||{});const t=mg.target&&A[mg.target];
  const card=(x,lab)=>`<div class="acct"><div style="flex:1;min-width:0"><div class="small muted">${lab}</div><b>${esc(x.name)}</b> <span class="small muted">${esc(x.country||"")}</span>

async function mergeInto(kind,o,n){if(!can("settings.manage"))throw{message:"Only a Supervisor can merge."};
  if(window.LD_HOSTED){const f=kind==="product"?window.__mergeProduct:window.__mergeEngineer;if(f)return await f(o,n)}
  return await renameEverywhere(kind,o,n,true)}
async function renameEverywhere(kind,o,n,merge){if(!can("settings.manage"))throw{message:"Only a Supervisor can rename products and engineers."};
  if(window.LD_HOSTED&&window.__renameEverywhere)return await window.__renameEverywhere(kind,o,n);
  // claude.ai version: same changes, written lead by lead
  const same=v=>typeof v==="string"&&v&&nk(v)===nk(o);const mapL=a=>Array.isArray(a)?[...new Set(a.map(x=>same(x)?n:x))]:a;const st=S.settings;const sb={};
  const ren=L=>merge?(L||[]).filter(x=>!same(typeof x==="string"?x:x.name)):(L||[]).map(x=>typeof x==="string"?(same(x)?n:x):same(x.name)?Object.assign({},x,{name:n}):x);
  if(kind==="product")sb.products=ren(st.products);
  else{sb.salespeople=ren(st.salespeople);sb.territories=(st.territories||[]).map(t=>same(t.engineer)?Object.assign({},t,{engineer:n}):t)}
  await S.db.doc("config/settings").update(sb);let c=0;
  for(const l of (S.allLeads||S.leads)){const b={};
    if(kind==="product"){if(Array.isArray(l.products)&&l.products.some(same)){b.products=mapL(l.products);b.product=b.products.join(", ")}else if(!Array.isArray(l.products)&&same(l.product))b.product=n;
      if(meetingsOf(l).some(m=>(m.products||[]).some(same)))b.meetings=meetingsOf(l).map(({legacy,...m})=>Object.assign({},m,{products:mapL(m.products)}))}
    else{["assignedTo","generatedBy","formerAssignee","preferred","territoryOwner","originalGenerator"].forEach(k=>{if(same(l[k]))b[k]=n});
      if(meetingsOf(l).some(m=>same(m.by)))b.meetings=meetingsOf(l).map(({legacy,...m})=>same(m.by)?Object.assign({},m,{by:n}):m);if(same(l.upsellMeeting?.by))b.upsellMeeting=Object.assign({},l.upsellMeeting,{by:n})}
    if(Object.keys(b).length){await S.db.doc("leads/"+l.id).update(b);c++}}
  if(kind==="engineer"){const m={};let ch=false;for(const[id,u]of Object.entries(S.users||{})){m[id]=Object.assign({},u);if(same(u.engineer)){m[id].engineer=n;ch=true}}if(ch){await S.db.doc("config/users").set({members:m});S.users=m}}
  return c}
function usersPanel(){const mem=Object.entries(S.users);const mapped=new Set(mem.filter(([,u])=>u.engineer).map(([,u])=>nk(u.engineer)));
  return`<div class="panel"><div class="row" style="margin-bottom:6px"><h3>Users and access</h3><span class="chip">${mem.length+(window.LD_HOSTED?0:1)} users</span></div>
   <p class="small muted" style="margin:0 0 12px;max-width:80ch">${window.LD_HOSTED?"Only people on this list can sign in. Add their work email and role; they sign in with the temporary password (or an email link) and choose their own password. Sales engineers only ever see the leads assigned to their linked name.":"Only people on this list can use Lead Desk; everyone else sees an access-denied page. People sign in with their claude.ai account. In the page's Share menu, give Supervisors <b>Editor</b> access and everyone else <b>Contributor</b> access."}</p>
   <div class="grid3" style="align-items:end">
     <label class="f">Person<div class="ta"><input id="uq" placeholder="${window.LD_HOSTED?"Work email address":"Search by name or email"}" autocomplete="off" value="${esc(S.upick?.label||"")}"><div class="sugg" id="usugg" hidden></div></div></label>
     <label class="f">Role<select id="urole">${ROLES.map(r=>`<option value="${r}"${(S.urole||"sales")===r?" selected":""}>${ROLE_LABEL[r]}</option>`).join("")}</select></label>
     <label class="f" id="uengWrap" ${(S.urole||"sales")==="sales"?"":"hidden"}>Linked sales engineer<select id="ueng">${opts(spNames().filter(n=>!mapped.has(nk(n))),"","Choose the engineer name")}</select></label>
   </div><div class="row" style="margin-top:10px"><button class="btn pri" id="uAdd" type="button">Add user</button><div id="uMsg" class="small"></div></div>
   ${S.userNote?`<div class="notice ${S.userNote.lvl}" style="margin-top:10px">${S.userNote.msg}</div>`:""}
   ${window.LD_HOSTED?`<p class="small muted" style="margin:8px 0 0">New users get the temporary password <b class="mono">Samsotech123</b> and must change it at first sign-in.</p>`:""}
   <div class="tw" style="margin-top:14px"><table><thead><tr><th>Person</th><th>Role</th><th>Sales engineer</th><th></th></tr></thead><tbody>
    ${window.LD_HOSTED?"":`<tr><td>${S.isOwner?"You":"Page owner"} <span class="chip">Owner</span></td><td>Supervisor</td><td>${esc((S.users[S.uid]||{}).engineer&&S.isOwner?S.users[S.uid].engineer:"—")}</td><td></td></tr>`}
    ${mem.filter(([id])=>window.LD_HOSTED||!(S.isOwner&&id===S.uid)).map(([id,u])=>`<tr><td><span data-uid="${esc(id)}" data-fallback="Unknown user">${esc(S.names[id]||"")}</span><div class="small muted" data-mail="${esc(id)}"></div>${window.LD_HOSTED?`<input data-uname="${esc(id)}" maxlength="60" placeholder="Display name" aria-label="Display name for ${esc(id)}" value="${esc(u.displayName||"")}" style="max-width:240px;margin-top:4px;padding:5px 8px;font-size:12.5px">`:""}</td>
      <td><select data-urole="${esc(id)}" style="width:auto" ${id===S.uid?"disabled":""}>${ROLES.map(r=>`<option value="${r}"${normRole(u.role)===r?" selected":""}>${ROLE_LABEL[r]}</option>`).join("")}</select></td>
      <td>${u.role==="sales"?`<select data-ueng="${esc(id)}" style="width:auto">${opts(spNames().filter(n=>nk(n)===nk(u.engineer)||!mapped.has(nk(n))),u.engineer,"Not linked")}</select>`:`<span class="muted">—</span>`}</td>
      <td class="num">${id===S.uid?`<span class="small muted">You</span>`:`${window.LD_HOSTED?`<button class="btn sm" data-ureset="${esc(id)}">Reset password</button> `:""}<button class="btn sm bad" data-urm="${esc(id)}">Remove</button>`}</td></tr>`).join("")}
   </tbody></table></div></div>`}
function bindUsers(){const inp=$("#uq"),sg=$("#usugg");if(!inp)return;
  fillNames();const ids=Object.keys(S.users);if(ids.length&&S.user)S.user.profiles(ids).then(ps=>ids.forEach(id=>{const e=document.querySelector(`[data-mail="${CSS.escape(id)}"]`);if(e&&ps[id]?.email&&nk(ps[id].email)!==nk(ps[id].name||""))e.textContent=ps[id].email})).catch(()=>{});
  const show=async()=>{if(!S.user)return;const hits=await S.user.search(inp.value.trim());
    sg.innerHTML=hits.length?hits.map(h=>`<button type="button" data-pid="${esc(h.id)}"><span style="flex:1;min-width:0"><b></b> <span class="small muted"></span></span>${S.users[h.id]||h.id===S.uid&&S.isOwner?`<span class="chip">already added</span>`:""}</button>`).join(""):`<div class="small muted" style="padding:10px 12px">${window.LD_HOSTED?"Type the person's full work email address.":"No matching colleague. They must be in your claude.ai organization."}</div>`;
    hits.forEach((h,i)=>{const b=sg.querySelectorAll("button")[i];if(!b)return;b.querySelector("b").textContent=h.name;b.querySelector(".muted").textContent=h.email||"";b.dataset.label=h.name+(h.email?" · "+h.email:"")});sg.hidden=false};
  inp.onfocus=show;inp.oninput=()=>{S.upick=null;show()};
  sg.onclick=e=>{const b=e.target.closest("button[data-pid]");if(!b)return;S.upick={id:b.dataset.pid,label:b.dataset.label};inp.value=b.dataset.label;sg.hidden=true};
  $("#urole").onchange=e=>{S.urole=e.target.value;$("#uengWrap").hidden=S.urole!=="sales"};
  const saveUsers=async(members,msg)=>{try{await S.db.doc("config/users").set({members});S.users=members;S.upick=null;toast(msg);render();return true}catch(e){toast("Couldn't save users: "+(e.code||e.message)+(e.code==="invalid_argument"?" — you need Editor access":""));return false}};
  $("#uAdd").onclick=async()=>{const M=$("#uMsg");const role=$("#urole").value,eng=role==="sales"?$("#ueng").value:"";
    if(!S.upick){M.innerHTML=`<span style="color:var(--bad)">Search for the person and pick them from the list.</span>`;return}
    if(S.users[S.upick.id]||(S.isOwner&&S.upick.id===S.uid)){M.innerHTML=`<span style="color:var(--bad)">This person is already a user. Change their role in the table.</span>`;return}
    if(role==="sales"&&!eng){M.innerHTML=`<span style="color:var(--bad)">Choose which sales engineer name this login belongs to.</span>`;return}
    const members=Object.assign({},S.users,{[S.upick.id]:{role,engineer:eng,addedAt:nowISO(),addedBy:S.uid}});
    const em=S.upick.id,lab=S.upick.label.split(" · ")[0];
    if(await saveUsers(members,"Added "+lab)){S.urole=role;
      if(window.LD_HOSTED&&window.__adminUser){S.userNote={lvl:"info",msg:`Creating a sign-in for ${em}…`};render();const r=await window.__adminUser("create",em);
        S.userNote=r.error?{lvl:"warn",msg:`${em} was added to the list, but the sign-in wasn't created: ${r.error}`}
          :r.status==="exists"?{lvl:"info",msg:`${em} already has a sign-in. Use Reset password if they need the temporary password again.`}
          :{lvl:"ok",msg:`Sign-in created for ${em}. Temporary password: <b class="mono">${esc(r.password)}</b>. They'll be asked to choose their own password the first time they sign in.`};render()}}};
  document.querySelectorAll("[data-urole]").forEach(sel=>sel.onchange=()=>{const id=sel.dataset.urole;const m=Object.assign({},S.users);m[id]=Object.assign({},m[id],{role:sel.value,engineer:sel.value==="sales"?m[id].engineer||"":""});saveUsers(m,"Role updated")});
  document.querySelectorAll("[data-uname]").forEach(inp=>{const go=()=>{const id=inp.dataset.uname;const v=inp.value.trim().replace(/\s+/g," ");if(v===(S.users[id]?.displayName||""))return;
      const m=Object.assign({},S.users);m[id]=Object.assign({},m[id],{displayName:v});S.names[id]=v||id;if(id===S.uid)S.myName=v||S.myEmail;saveUsers(m,v?`Display name set to ${v}`:"Display name removed")};
    inp.onchange=go;inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();inp.blur()}}});
  document.querySelectorAll("[data-ueng]").forEach(sel=>sel.onchange=()=>{const id=sel.dataset.ueng;const m=Object.assign({},S.users);m[id]=Object.assign({},m[id],{engineer:sel.value});saveUsers(m,"Engineer link updated")});
  document.querySelectorAll("[data-ureset]").forEach(b=>b.onclick=async()=>{const em=b.dataset.ureset;
    if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Confirm reset";return}
    b.disabled=true;b.textContent="Resetting…";const r=await window.__adminUser("reset",em);
    S.userNote=r.error?{lvl:"bad",msg:`Couldn't reset ${em}: ${esc(r.error)}`}:{lvl:"ok",msg:`${r.status==="created"?"Sign-in created":"Password reset"} for ${em}. Temporary password: <b class="mono">${esc(r.password)}</b>. They must choose a new one when they sign in.`};render()});
  document.querySelectorAll("[data-urm]").forEach(b=>b.onclick=()=>{if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Confirm remove";return}const m=Object.assign({},S.users);delete m[b.dataset.urm];saveUsers(m,"User removed")})}
function useCount(name,kind){return S.leads.filter(l=>kind==="p"?productsOf(l).includes(name):l.assignedTo===name).length}

if(window.LD_HOSTED){window.__startApp=boot;if(window.__ldReady)boot()}else boot();
</script>
