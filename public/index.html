</head><body>

<style>
/* Layout: one working column under a sticky role bar; each role gets its own tab, lists left / detail in a slide-over drawer */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunk:#EAEEF3; --ink:#142131; --muted:#5A6779; --line:#D9DFE7;
  --accent:#1E5AA8; --accent-ink:#FFFFFF; --accent-soft:#E3ECF8;
  --inb:#0D7A73; --inb-soft:#DDF2EF; --outb:#A35F00; --outb-soft:#FBEBD3;
  --ok:#1D7A3A; --ok-soft:#DFF3E4; --warn:#9A6200; --warn-soft:#FCEFD6; --bad:#B42318; --bad-soft:#FCE4E2;
  --shadow:0 10px 30px rgba(20,33,49,.16);
  --c-main:#1E5AA8; --c-in:#008F84; --c-out:#A35F00;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E131A; --surface:#161D26; --sunk:#1D2631; --ink:#E5EAF1; --muted:#97A4B5; --line:#2A3542;
  --accent:#6EA4EE; --accent-ink:#0B1420; --accent-soft:#1D2E45;
  --inb:#3FC2B8; --inb-soft:#14302E; --outb:#E8A54B; --outb-soft:#372815;
  --ok:#5BC97A; --ok-soft:#16301F; --warn:#E5B04F; --warn-soft:#352914; --bad:#F27B70; --bad-soft:#3A1C1A;
  --shadow:0 10px 30px rgba(0,0,0,.5); --c-main:#5A93DF; --c-in:#1E9C92; --c-out:#C4862F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#161D26; --sunk:#1D2631; --ink:#E5EAF1; --muted:#97A4B5; --line:#2A3542;
  --accent:#6EA4EE; --accent-ink:#0B1420; --accent-soft:#1D2E45;
  --inb:#3FC2B8; --inb-soft:#14302E; --outb:#E8A54B; --outb-soft:#372815;
  --ok:#5BC97A; --ok-soft:#16301F; --warn:#E5B04F; --warn-soft:#352914; --bad:#F27B70; --bad-soft:#3A1C1A;
  --shadow:0 10px 30px rgba(0,0,0,.5); --c-main:#5A93DF; --c-in:#1E9C92; --c-out:#C4862F; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.005em}
h2{font-size:22px;font-weight:600} h3{font-size:16px;font-weight:600}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:20px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px}
.brand h1{font-size:19px;font-weight:700}
.brand .mono{color:var(--muted)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
nav.tabs button{background:none;border:0;color:var(--muted);font:500 13.5px var(--f-body);padding:8px 12px;border-radius:6px;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
nav.tabs button:hover{color:var(--ink);background:var(--sunk)}
nav.tabs button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
.count{font:500 11px var(--f-mono);background:var(--bad);color:#fff;border-radius:10px;padding:1px 6px}
.chip.newl{background:var(--bad);color:#fff;border-color:transparent}.newpanel{border-left:3px solid var(--bad)}
.count.n{background:var(--line);color:var(--ink)}
main{max-width:1240px;margin:0 auto;padding-block:22px 60px}
.view{display:grid;gap:18px}
.vhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.vhead p{margin:4px 0 0;color:var(--muted);max-width:68ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.panel>h3{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.formgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.formgrid,.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
label.f{display:block;font-size:12.5px;font-weight:500;color:var(--muted)}
label.f>input,label.f>select,label.f>textarea,label.f>.ta,label.f>.seg{display:block;margin-top:4px}
label.f>.seg{display:inline-flex}
label.f .req{color:var(--bad)}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{font:500 13.5px var(--f-body);border-radius:7px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:4px;font:500 11.5px var(--f-body);padding:2px 8px;border-radius:20px;background:var(--sunk);color:var(--muted);white-space:nowrap;letter-spacing:.01em}
.chip.m-on{background:var(--accent-soft);color:var(--accent)} .chip.m-site{background:var(--ok-soft);color:var(--ok)}
.chip.inb{background:var(--inb-soft);color:var(--inb)} .chip.outb{background:var(--outb-soft);color:var(--outb)}
.st{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:4px;white-space:nowrap}
.st-New{background:var(--accent-soft);color:var(--accent)} .st-Info{background:var(--warn-soft);color:var(--warn)}
.st-Assigned{background:var(--sunk);color:var(--ink)} .st-Meeting{background:var(--inb-soft);color:var(--inb)}
.st-Quotation{background:var(--outb-soft);color:var(--outb)} .st-Won{background:var(--ok-soft);color:var(--ok)}
.st-Lost,.st-Rejected,.st-Duplicate{background:var(--bad-soft);color:var(--bad)} .st-On{background:var(--sunk);color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--muted);font:500 13px var(--f-body);padding:7px 14px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.cat button[data-v="Inbound"][aria-pressed="true"]{background:var(--inb);color:#fff}
.seg.cat button[data-v="Outbound"][aria-pressed="true"]{background:var(--outb);color:#fff}
/* account typeahead */
.ta{position:relative}
.sugg{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);z-index:5;max-height:300px;overflow:auto}
.sugg button{display:flex;width:100%;text-align:left;gap:8px;align-items:center;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 12px;color:var(--ink);font:inherit;cursor:pointer}
.sugg button:hover,.sugg button.hl{background:var(--accent-soft)}
.sugg .new{color:var(--accent);font-weight:500}
.acct{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.notice{border-radius:8px;padding:10px 12px;font-size:13px}
.notice.warn{background:var(--warn-soft);color:var(--warn)} .notice.bad{background:var(--bad-soft);color:var(--bad)} .notice.ok{background:var(--ok-soft);color:var(--ok)} .notice.info{background:var(--accent-soft);color:var(--accent)}
.prodgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.pchk{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:7px;padding:7px 9px;cursor:pointer;font-size:13px;background:var(--surface)}
.pchk input{width:auto;margin-top:3px}
.pchk.sel{border-color:var(--accent);background:var(--accent-soft)}
.pchk.blocked{opacity:.6;cursor:not-allowed;background:var(--sunk)}
.pchk.hist{border-style:dashed;border-color:var(--warn)}
.pchk small{display:block;color:var(--muted);font-size:11.5px;line-height:1.3}
.pchk.blocked small{color:var(--bad)}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--accent-soft)}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* analytics */
.afbar{display:grid;gap:8px;padding:14px 16px}
.fgrid{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}.fgrid .f{min-width:150px}.fgrid .f>span:first-child{display:block}
.kpis.k7{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.kpis.k5{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.kpis.k7 .v,.kpis.k5 .v{font-size:23px}
.sortb{all:unset;cursor:pointer;display:inline-flex;gap:5px;align-items:center;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;white-space:nowrap;border-radius:4px}
.sortb:hover{color:var(--ink)}.sortb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sarr{font-size:8px;opacity:.35;letter-spacing:-1px}th[aria-sort=ascending] .sarr,th[aria-sort=descending] .sarr{opacity:1;color:var(--accent);font-size:9px}
th[aria-sort=ascending],th[aria-sort=descending]{color:var(--ink)}
th.num .sortb{justify-content:flex-end;width:100%}
.ast{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap}.ast i{width:8px;height:8px;border-radius:50%;flex:none}
.req{display:inline-block;font-size:11.5px;line-height:1.5;padding:0 7px;border:1px solid var(--line);border-radius:10px;margin:1px 4px 1px 0;white-space:nowrap;color:var(--ink)}
.req.won{border-color:var(--ok);background:var(--ok-soft)}.req.cl{color:var(--muted)}
.dbar{display:block;height:4px;background:var(--sunk);border-radius:2px;margin-top:5px;min-width:60px}.dbar i{display:block;height:100%;border-radius:2px}
td.num .dbar{margin-left:auto;max-width:120px}
.hb{display:grid;gap:7px}.hbr{display:grid;grid-template-columns:minmax(80px,130px) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.hbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbt{height:14px;display:block}.hbt i{display:block;height:100%;border-radius:0 4px 4px 0;min-width:2px}
.hbt.two{height:auto;display:grid;gap:2px}.hbt.two i{height:7px}
.hbv{font-family:var(--f-mono);font-size:12px;text-align:right;white-space:nowrap;color:var(--ink)}
.ins{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.insc{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface)}.insc.hl{background:var(--accent-soft);border-color:transparent}
.insc .q{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.insc .w{font:600 18px var(--f-display);margin-top:4px}
.insc .m{font-family:var(--f-mono);font-size:12.5px}.insc .r{font-size:12px;color:var(--muted);margin-top:4px}
.rk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font:600 11px var(--f-mono);background:var(--sunk);color:var(--muted);margin-right:8px;vertical-align:1px}
.rk.r1{background:var(--accent);color:var(--accent-ink)}.rk.r2,.rk.r3{background:var(--accent-soft);color:var(--accent)}
td.num .rk{margin:0}
tr.top td{background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
tr.tot td{background:var(--sunk);font-weight:600}
.subnav{display:flex;gap:6px;flex-wrap:wrap}.mg td b,.tw.acct td:nth-child(3){white-space:nowrap}
.h4{font:600 13.5px var(--f-body);margin:0 0 4px}
.grid2.tight{gap:18px}
.cmp{margin-bottom:12px}.cmp .row{gap:12px}.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.split2{display:flex;height:14px;gap:2px}.split2 i{display:block;height:100%}.split2 i:first-child{border-radius:4px 0 0 4px}.split2 i:last-child{border-radius:0 4px 4px 0}
.tw.acct td{vertical-align:middle}
.mg [id^=mg-]{scroll-margin-top:70px}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.4;padding:6px 9px;border-radius:6px;max-width:300px;box-shadow:var(--shadow)}
.view>*,.grid2>*,.mg .panel{min-width:0}
td.mono{white-space:nowrap}.fgrid select,.fgrid input{height:38px}.fexp{margin-left:auto}.expw{position:relative}.expm{position:absolute;right:0;top:calc(100% + 4px);z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:220px;display:grid}
.expm button{all:unset;cursor:pointer;padding:8px 10px;border-radius:6px;font-size:13.5px}.expm button:hover,.expm button:focus-visible{background:var(--accent-soft);color:var(--accent)}
.fgrid .f.fsearch{min-width:230px;flex:1 1 230px;max-width:340px}.fgrid .f.fsm{min-width:120px}
.afchips{gap:6px}.fchip{all:unset;cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-size:12.5px;padding:3px 10px;border-radius:14px;background:var(--accent-soft);color:var(--accent)}
.fchip span{font-size:14px;line-height:1}.fchip:hover{background:var(--accent);color:var(--accent-ink)}.fchip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px;margin-right:4px}@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:760px){.fexp{margin-left:0;min-width:100%!important}.expm{left:0;right:auto}.fgrid .f.fsearch{max-width:none;min-width:100%}}

@media (max-width:760px){.grid2.tight,.mg .grid2{grid-template-columns:1fr}.hbr{grid-template-columns:minmax(70px,96px) 1fr auto}.fgrid .f.fw{min-width:100%}.fgrid .f{min-width:calc(50% - 7px);flex:1}}
/* queue cards */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:8px}
.qcard.flag{border-left:3px solid var(--warn)} .qcard.blockd{border-left:3px solid var(--bad)}
.qtop{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.qtop b{font-size:15px}
.kv{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.kv span b{color:var(--ink);font-weight:500}
/* pipeline board */
.board{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border-radius:10px;padding:10px;display:grid;gap:8px;align-content:start;min-height:120px}
.col h4{margin:0;font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between}
.lc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;cursor:pointer;display:grid;gap:4px;text-align:left;color:var(--ink);font:inherit;width:100%}
.lc:hover{border-color:var(--accent)}
.lc .amt{font:500 13px var(--f-mono)}
.lc .late{color:var(--bad);font-size:11.5px;font-weight:500}
/* KPIs + charts */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi .l{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi .v{font:600 26px var(--f-display);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.funnel{display:grid;gap:8px}
.frow{display:grid;grid-template-columns:130px minmax(0,1fr) 110px;gap:10px;align-items:center;font-size:13px}
.fbar{height:24px;background:var(--sunk);border-radius:5px;overflow:hidden}
.fbar i{display:block;height:100%;background:var(--accent);border-radius:5px;min-width:2px}
.frow .num{text-align:right;font-variant-numeric:tabular-nums}
.split{display:flex;height:30px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.split i{display:flex;align-items:center;justify-content:center;color:#fff;font:600 12px var(--f-body);min-width:0;overflow:hidden;white-space:nowrap}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg text{fill:var(--muted);font:11px var(--f-body)}
.alerts{display:grid;gap:6px}
.alert{display:flex;gap:10px;align-items:center;font-size:13px;padding:8px 10px;border-radius:7px;background:var(--sunk);cursor:pointer;border:0;color:var(--ink);text-align:left;font-family:inherit;width:100%}
.alert:hover{background:var(--accent-soft)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,16,24,.45);z-index:20;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(620px,100%);height:100%;overflow:auto;box-shadow:var(--shadow);display:grid;align-content:start;gap:14px;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(30px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.timeline{display:grid;gap:6px;font-size:12.5px}
.timeline div{display:grid;grid-template-columns:130px 1fr;gap:10px;color:var(--muted)}
.timeline div span:last-child{color:var(--ink)}
.stages{display:flex;gap:4px;flex-wrap:wrap}
.stages span{flex:1;min-width:70px;text-align:center;font:600 10.5px var(--f-body);text-transform:uppercase;letter-spacing:.05em;padding:6px 4px;border-radius:4px;background:var(--sunk);color:var(--muted)}

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function keyOf(n){let s=String(n||"").toLowerCase().replace(/&/g," and ").replace(/[^a-z0-9 ]/g," ");
  const t=s.split(/\s+/).filter(w=>w&&!STOP.has(w));let k=t.join("-").slice(0,120);
  return k||String(n||"").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,120)}
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m||!n)return m||n;let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function similar(k1,k2){if(!k1||!k2)return 0;if(k1===k2)return 1;
  const A=new Set(k1.split("-")),B=new Set(k2.split("-"));let inter=0;A.forEach(x=>B.has(x)&&inter++);
  const jac=inter/(A.size+B.size-inter);const lr=1-lev(k1,k2)/Math.max(k1.length,k2.length);
  const contains=(k1.length>5&&k2.includes(k1))||(k2.length>5&&k1.includes(k2))?0.8:0;return Math.max(jac,lr,contains)}
const nowISO=()=>new Date().toISOString();
const days=iso=>iso?(Date.now()-new Date(iso).getTime())/864e5:0;
function fmtD(iso){if(!iso)return"—";const d=new Date(iso);return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})}
function fmtAED(n){n=Math.round(n||0);if(Math.abs(n)>=1e6)return"AED "+(n/1e6).toFixed(2)+"M";return"AED "+n.toLocaleString("en-US")}
function fmtN(n){return(n||0).toLocaleString("en-US")}

const nk=s=>String(s||"").trim().replace(/\s+/g," ").toLowerCase();

/* ---------- account + product duplicate logic ---------- */
function allAccounts(){const m={};for(const[k,a]of Object.entries(S.registry))m[k]={key:k,name:a.n,country:a.c,hist:a.p||{},wonHist:!!a.w,live:false};
  for(const[k,a]of Object.entries(S.remoteAcc||{}))if(!m[k])m[k]={key:k,name:a.name,country:a.country||"",hist:a.hist||{},live:true,remote:true};
  for(const l of S.leads)if(l.accountKey&&!m[l.accountKey])m[l.accountKey]={key:l.accountKey,name:l.accountName,country:l.country||"",hist:{},live:true};
  for(const[k,a]of Object.entries(S.accounts))if(!a.deleted)m[k]=Object.assign(m[k]||{hist:{}},{key:k,name:a.name,country:a.country||m[k]?.country||"",city:a.city,group:a.group,live:true});
  for(const[k,a]of Object.entries(S.accounts))if(a.deleted){if(a.mergedInto&&m[a.mergedInto])m[a.mergedInto].hist=Object.assign({},S.registry[k]?.p||{},m[a.mergedInto].hist||{});delete m[k]}
  return m}
function histOf(key){const h={};for(const[k,a]of Object.entries(S.accounts))if(a.deleted&&a.mergedInto===key)Object.assign(h,S.registry[k]?.p||{});return Object.assign(h,S.registry[key]?.p||{})}
const removedAccounts=()=>Object.entries(S.accounts).filter(([,a])=>a.deleted).map(([k,a])=>Object.assign({key:k},a)).sort((x,y)=>(y.deletedAt||"")>(x.deletedAt||"")?1:-1);
const normTxt=x=>String(x||"").toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/&/g," and ").replace(/[^a-z0-9]+/g," ").trim();
function findAccounts(q,limit=8,withPlace){const nq=normTxt(q);if(nq.length<2)return[];const k=keyOf(q);const qt=nq.split(" ");const out=[];
  for(const a of Object.values(allAccounts())){const nn=normTxt(a.name);const words=(withPlace?nn+" "+normTxt(a.country)+" "+normTxt(a.city):nn).split(" ");let s=0;
    if(a.key===k||nn===nq)s=1;else if(nn.startsWith(nq))s=.96;else if(qt.every(t=>words.some(w=>w.startsWith(t))))s=.92;else if(nn.includes(nq))s=.88;
    else if(nq.length>=5){const f=similar(k,a.key);if(f>=.78)s=f*.85}
    if(s)out.push([s,a])}
  out.sort((x,y)=>y[0]-x[0]||x[1].name.localeCompare(y[1].name));
  return out.sort((x,y)=>y[0]-x[0]).slice(0,limit).map(x=>Object.assign({score:x[0]},x[1]))}
function leadsFor(key){return S.leads.filter(l=>l.accountKey===key)}
function productState(key,product,exceptId){const pdef=prodList(true).find(p=>p.name===product)||{};
  if(pdef.repeatable)return{state:"ok"};
  const live=leadsFor(key).filter(l=>l.id!==exceptId&&productsOf(l).includes(product)&&BLOCKING.includes(l.status));
  if(live.length){const l=live[0];return{state:"blocked",lead:l,msg:`${l.status==="Won"?"Already won":"Open"} · ${l.ref}${l.assignedTo?" · "+l.assignedTo:""}`}}
  const ext=(S.extLocks[key]||[]).find(r=>r.product===product&&r.ref!==exceptId&&BLOCKING.includes(r.status));
  if(ext)return{state:"blocked",lead:{id:ext.ref,ref:ext.ref,status:ext.status,assignedTo:ext.assigned_to},msg:`${ext.status==="Won"?"Already won":"Open"} · ${ext.ref}${ext.assigned_to?" · "+ext.assigned_to:""}`};
  const h=histOf(key)[product];
  if(h)return{state:"hist",msg:`In 2026 sheet · ${h.r}${h.e?" · "+h.e:""}`};
  return{state:"ok"}}
function dupChecks(l){const out=[];const others=S.leads.filter(x=>x.id!==l.id);
  productsOf(l).forEach(p=>{const ps=productState(l.accountKey,p,l.id);
    if(ps.state==="blocked"){const x=ps.lead;out.push({lvl:"bad",msg:`${p} is already ${x.status==="Won"?"won":"open"} for this account: ${x.ref} (${x.status}${x.assignedTo?", "+x.assignedTo:""})`,ref:x.id})}
    const h=histOf(l.accountKey)[p];if(h)out.push({lvl:"warn",msg:`${p} was logged in the 2026 sheet: ${h.r}${h.e?" with "+h.e:""}${h.m?" ("+h.m+")":""}`})});
  const em=(l.contact?.email||"").toLowerCase();if(em)others.filter(x=>(x.contact?.email||"").toLowerCase()===em&&x.accountKey!==l.accountKey).slice(0,2).forEach(x=>out.push({lvl:"warn",msg:`Same contact email used on another account: ${x.accountName} (${x.ref})`,ref:x.id}));
  const near=findAccounts(l.accountName,4).filter(a=>a.key!==l.accountKey&&a.score>=0.75);near.forEach(a=>out.push({lvl:"warn",msg:`Similar account exists: ${a.name}${a.country?" · "+a.country:""}`}));
  const dom=emailDomain(em);if(dom){const sib=others.filter(x=>emailDomain(x.contact?.email)===dom&&x.accountKey!==l.accountKey);if(sib.length)out.push({lvl:"info",msg:`${sib.length} other lead(s) share the domain @${dom} — possibly the same group or chain`})}
  return out}

async function nextRef(){if(window.LD_HOSTED){const{data,error}=await window.__sb.rpc("next_lead_ref");if(error)throw{code:error.code==="42501"?"invalid_argument":"unavailable",message:error.message};return data}

/* ======================= ANALYTICS (one calculation shared by Accounts and Management) =======================
   Source of truth: the leads table only. Definitions used everywhere:
   - Lead in scope: not Duplicate/Rejected, visible to this user (own leads for Sales), received (requirement date) inside the period.
   - Order closed: lead status Won. Revenue: its order value in AED (falls back to the quoted/meeting value, as elsewhere in Lead Desk).
   - Converted: lead reached a meeting or beyond (Meeting Done, Quotation Sent, Won). Conversion rate: orders closed ÷ leads.
   - Engineer: the lead's assigned engineer. An engineer's accounts: distinct properties with at least one of their leads.
   - Account status: Customer (any order) › Active (open lead) › On hold › Lost (all leads lost) › Inactive. */
const AF_DEF={period:"ytd",from:"",to:"",region:"",eng:"",src:"All",status:""};
const PERIODS=[["month","This month"],["last30","Last 30 days"],["quarter","This quarter"],["ytd","Year to date"],["last12","Last 12 months"],["lastyear","Last calendar year"],["all","All time"],["custom","Custom range"]];
const ACC_STATUS=[["Customer","--ok","At least one order closed"],["Active","--accent","Has an open lead"],["On hold","--warn","Leads on hold"],["Lost","--bad","Every lead lost"],["Inactive","--muted","No open lead or order"]];
const MIN_CONV=5;   // leads needed before a conversion rate is ranked
function af(){return S.af||(S.af=Object.assign({},AF_DEF))}
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function periodRange(F){const n=new Date(),y=n.getFullYear(),mo=n.getMonth(),D=(a,b,c)=>new Date(a,b,c);let f=null,t=null;
  switch(F.period){case"month":f=D(y,mo,1);break;case"last30":f=new Date(n.getTime()-29*864e5);break;case"quarter":f=D(y,Math.floor(mo/3)*3,1);break;
    case"ytd":f=D(y,0,1);break;case"last12":f=D(y-1,mo+1,1);break;case"lastyear":f=D(y-1,0,1);t=D(y-1,11,31);break;case"custom":return[F.from||null,F.to||null];default:return[null,null]}
  return[f?ymd(f):null,t?ymd(t):null]}
function periodText(F){const[f,t]=periodRange(F);if(!f&&!t)return"All time";return`${f?fmtD(f+"T12:00:00"):"Start"} – ${t?fmtD(t+"T12:00:00"):"today"}`}
const accKey=l=>l.accountKey||"name:"+nk(l.accountName);
const orderVal=l=>l.status==="Won"?leadValue(l):0;
const reachedMeeting=l=>["Meeting Done","Quotation Sent","Won"].includes(l.status)||!!(l.stageAt?.["Meeting Done"]||l.stageAt?.["Quotation Sent"]);
function acctStatus(ls){if(ls.some(l=>l.status==="Won"))return"Customer";if(ls.some(l=>OPEN.includes(l.status)&&l.status!=="On Hold"))return"Active";
  if(ls.some(l=>l.status==="On Hold"))return"On hold";if(ls.length&&ls.every(l=>l.status==="Lost"))return"Lost";return"Inactive"}
const pct=(a,b)=>b?a/b:0, fmtP=x=>(x*100).toFixed(x>0&&x<.1?1:0)+"%";
function analytics(F){const[f,t]=periodRange(F);
  let ls=S.leads.filter(l=>(viewAll()||isMine(l))&&!["Duplicate","Rejected"].includes(l.status)).filter(l=>{const d=reqDate(l);return(!f||d>=f)&&(!t||d<=t)})
    .filter(l=>(!F.region||regionOf(l)===F.region)&&(F.src==="All"||(l.category==="Outbound"?"Outbound":"Inbound")===F.src)&&(!F.eng||l.assignedTo===F.eng));

function mgmtOps(m){const AF=af();const inReg=l=>(!AF.region||regionOf(l)===AF.region)&&(!AF.eng||l.assignedTo===AF.eng)&&(viewAll()||isMine(l));const all=S.leads.filter(inPeriod).filter(inReg).filter(l=>AF.src==="All"||(l.category==="Outbound"?"Outbound":"Inbound")===AF.src);

  const verH=valid.filter(l=>l.verifiedAt).map(l=>(new Date(l.verifiedAt)-new Date(l.createdAt))/36e5);const avgVer=verH.length?verH.reduce((a,b)=>a+b,0)/verH.length:null;
  const grp=(keyF)=>{const g={};valid.forEach(l=>{const ks=[].concat(keyF(l)||"—");ks.forEach(k=>{const o=g[k]||(g[k]={n:0,meet:0,quote:0,won:0,wonV:0,pipe:0,lost:0});o.n++;if(has(l,"Meeting Done"))o.meet++;if(has(l,"Quotation Sent"))o.quote++;if(l.status==="Won"){o.won++;o.wonV+=leadValue(l)}if(l.status==="Lost")o.lost++;if(["Meeting Done","Quotation Sent"].includes(l.status))o.pipe+=leadValue(l)})});return Object.entries(g).sort((a,b)=>b[1].wonV-a[1].wonV||b[1].n-a[1].n)};
  const cat={Inbound:{n:0,v:0,w:0},Outbound:{n:0,v:0,w:0}};S.leads.filter(inPeriod).filter(inReg).filter(l=>!["Duplicate","Rejected"].includes(l.status)).forEach(l=>{const c=cat[l.category]||cat.Inbound;c.n++;if(l.status==="Won"){c.w++;c.v+=leadValue(l)}});

function weeklySeries(n){const out=[];const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));
  for(let i=n-1;i>=0;i--){const s=new Date(d);s.setDate(s.getDate()-7*i);const e=new Date(s);e.setDate(e.getDate()+7);
    const ls=S.leads.filter(l=>{const c=new Date(reqDate(l)+"T12:00:00");return c>=s&&c<e&&(!af().region||regionOf(l)===af().region)&&!["Duplicate","Rejected"].includes(l.status)});
    out.push({label:s.toLocaleDateString("en-GB",{day:"2-digit",month:"short"}),in:ls.filter(l=>l.category!=="Outbound").length,out:ls.filter(l=>l.category==="Outbound").length})}return out}
function weekChart(ws,target){const W=760,H=200,pl=34,pb=26,pt=10;const mx=Math.max(target*1.2,...ws.map(w=>w.in+w.out),1);const step=Math.ceil(mx/4/5)*5||5;const top=step*4;
  const bw=(W-pl-10)/ws.length;const y=v=>pt+(H-pt-pb)*(1-v/top);
  let g="";for(let v=0;v<=top;v+=step)g+=`<line x1="${pl}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const bars=ws.map((w,i)=>{const x=pl+i*bw+bw*.18,ww=bw*.64;return`<rect x="${x}" y="${y(w.in)}" width="${ww}" height="${y(0)-y(w.in)}" fill="var(--inb)" rx="2"/><rect x="${x}" y="${y(w.in+w.out)}" width="${ww}" height="${y(w.in)-y(w.in+w.out)}" fill="var(--outb)" rx="2"/>${i%2===ws.length%2?"":`<text x="${x+ww/2}" y="${H-8}" text-anchor="middle">${w.label}</text>`}`}).join("");
  return`<div class="legend" style="margin-bottom:6px"><span><i style="background:var(--inb)"></i>Inbound</span><span><i style="background:var(--outb)"></i>Outbound</span><span><i style="background:var(--bad);height:2px"></i>Target ${target}/week</span></div>
   <div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:520px;height:auto" role="img" aria-label="Weekly leads, last ${ws.length} weeks">${g}${bars}<line x1="${pl}" x2="${W-6}" y1="${y(target)}" y2="${y(target)}" stroke="var(--bad)" stroke-dasharray="5 4"/></svg></div>`}
function baseline(){const h=S.history;if(!h)return"";const ms=Object.keys(h.leadsByMonth);const W=760,H=210,pl=40,pr=56,pb=26,pt=12;
  const mxL=Math.max(...ms.map(k=>h.leadsByMonth[k]));const mxV=Math.max(...ms.map(k=>h.orderValueByMonth[k]||0),1);const topL=Math.ceil(mxL/50)*50,topV=Math.ceil(mxV/1e5)*1e5;
  const bw=(W-pl-pr)/ms.length;const y=(v,t)=>pt+(H-pt-pb)*(1-v/t);
  let g="";for(let i=0;i<=4;i++){const v=topL/4*i;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v,topL)}" y2="${y(v,topL)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v,topL)+4}" text-anchor="end">${v}</text><text x="${W-pr+6}" y="${y(v,topL)+4}">${(topV/4*i/1000).toFixed(0)}k</text>`}
  const bars=ms.map((k,i)=>{const x=pl+i*bw+bw*.2,ww=bw*.6;const mn=new Date(k+"-01").toLocaleDateString("en-GB",{month:"short"});return`<rect x="${x}" y="${y(h.leadsByMonth[k],topL)}" width="${ww}" height="${y(0,topL)-y(h.leadsByMonth[k],topL)}" fill="var(--accent)" opacity=".75" rx="2"/><text x="${x+ww/2}" y="${H-8}" text-anchor="middle">${mn}</text>`}).join("");
  const pts=ms.map((k,i)=>[pl+i*bw+bw/2,y(h.orderValueByMonth[k]||0,topV)]);
  const line=`<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--ok)" stroke-width="2.5"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--ok)"/>`).join("");
  const src=Object.entries(h.leadsBySource).filter(([k])=>k!=="Other");
  return`<div class="panel"><div class="row" style="margin-bottom:10px"><h3>2026 baseline from the Excel workbook</h3><span class="chip">to ${fmtD(h.asOf)}</span></div>
   <div class="kpis" style="margin-bottom:14px"><div class="kpi"><div class="l">Leads logged</div><div class="v">${fmtN(h.leads)}</div><div class="s">${fmtN(h.accounts)} unique properties</div></div><div class="kpi"><div class="l">Orders</div><div class="v">${h.orders}</div><div class="s">${(h.orders/h.leads*100).toFixed(1)}% of leads</div></div><div class="kpi"><div class="l">Order value</div><div class="v">${fmtAED(h.orderValueAED)}</div><div class="s">avg ${fmtAED(h.orderValueAED/h.orders)}</div></div><div class="kpi"><div class="l">Inbound share</div><div class="v">${Math.round(h.leadsByCategory.Inbound/h.leads*100)}%</div><div class="s">${Math.round(h.orderValueByCategory.Inbound/h.orderValueAED*100)}% of order value</div></div></div>
   <div class="legend" style="margin-bottom:6px"><span><i style="background:var(--accent)"></i>Leads per month (left)</span><span><i style="background:var(--ok)"></i>Order value AED (right)</span></div>
   <div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:520px;height:auto" role="img" aria-label="2026 monthly leads and order value">${g}${bars}${line}</svg></div>
   <div class="tw" style="margin-top:14px"><table><thead><tr><th>Source (sheet)</th><th class="num">Leads</th><th class="num">Orders</th><th class="num">Conv.</th><th class="num">Order value</th></tr></thead><tbody>
   ${src.map(([k,n])=>`<tr><td>${esc(k)} <span class="chip ${catOf(k)==="Outbound"?"outb":"inb"}">${catOf(k)==="Outbound"?"Out":"In"}</span></td><td class="num">${n}</td><td class="num">${h.ordersBySource[k]||0}</td><td class="num">${((h.ordersBySource[k]||0)/n*100).toFixed(1)}%</td><td class="num">${fmtAED(h.orderValueBySource[k]||0)}</td></tr>`).join("")}</tbody></table></div></div>`}
async function exportCSV(){const cols=["ref","requirementDate","createdAt","accountName","country","region","product","category","source","generatedBy","department","contact.name","contact.email","contact.phone","status","assignedTo","priority","meeting.aed","quote.aed","quote.no","order.aed","order.no","order.date","lost.reason"];

function likelyDuplicates(a,limit=6){const n=normTxt(a.name);if(n.length<3)return[];const out=[];const A=allAccounts();
  for(const b of Object.values(A)){if(b.key===a.key)continue;const m=normTxt(b.name);if(!m)continue;let sc=0;
    if(m===n)sc=1;else if(m.startsWith(n+" ")||n.startsWith(m+" "))sc=.9;else if(m.slice(0,3)===n.slice(0,3)&&Math.abs(m.length-n.length)<8){const f=similar(a.key,b.key);if(f>=.82)sc=f}
    if(sc&&(!a.country||!b.country||sc>=.95||normTxt(a.country)===normTxt(b.country)||guessRegion(a.country)===guessRegion(b.country)))out.push([sc,b])}
  return out.sort((x,y)=>y[0]-x[0]).slice(0,limit).map(x=>x[1])}

   ${window.LD_HOSTED?`<p class="small muted" style="margin:8px 0 0">New users get the temporary password <b class="mono">Samsotech123</b> and must change it at first sign-in.</p>`:""}
   <div class="tw" style="margin-top:14px"><table><thead><tr><th>Person</th><th>Role</th><th>Sales engineer</th><th></th></tr></thead><tbody>
    ${window.LD_HOSTED?"":`<tr><td>${S.isOwner?"You":"Page owner"} <span class="chip">Owner</span></td><td>Supervisor</td><td>${esc((S.users[S.uid]||{}).engineer&&S.isOwner?S.users[S.uid].engineer:"—")}</td><td></td></tr>`}
    ${mem.filter(([id])=>window.LD_HOSTED||!(S.isOwner&&id===S.uid)).map(([id,u])=>`<tr><td><span data-uid="${esc(id)}" data-fallback="Unknown user">${esc(S.names[id]||"")}</span><div class="small muted" data-mail="${esc(id)}"></div></td>
      <td><select data-urole="${esc(id)}" style="width:auto" ${id===S.uid?"disabled":""}>${ROLES.map(r=>`<option value="${r}"${normRole(u.role)===r?" selected":""}>${ROLE_LABEL[r]}</option>`).join("")}</select></td>
      <td>${u.role==="sales"?`<select data-ueng="${esc(id)}" style="width:auto">${opts(spNames().filter(n=>nk(n)===nk(u.engineer)||!mapped.has(nk(n))),u.engineer,"Not linked")}</select>`:`<span class="muted">—</span>`}</td>
      <td class="num">${id===S.uid?`<span class="small muted">You</span>`:`${window.LD_HOSTED?`<button class="btn sm" data-ureset="${esc(id)}">Reset password</button> `:""}<button class="btn sm bad" data-urm="${esc(id)}">Remove</button>`}</td></tr>`).join("")}
   </tbody></table></div></div>`}
function bindUsers(){const inp=$("#uq"),sg=$("#usugg");if(!inp)return;
  fillNames();const ids=Object.keys(S.users);if(ids.length&&S.user)S.user.profiles(ids).then(ps=>ids.forEach(id=>{const e=document.querySelector(`[data-mail="${CSS.escape(id)}"]`);if(e&&ps[id]?.email)e.textContent=ps[id].email})).catch(()=>{});
  const show=async()=>{if(!S.user)return;const hits=await S.user.search(inp.value.trim());
    sg.innerHTML=hits.length?hits.map(h=>`<button type="button" data-pid="${esc(h.id)}"><span style="flex:1;min-width:0"><b></b> <span class="small muted"></span></span>${S.users[h.id]||h.id===S.uid&&S.isOwner?`<span class="chip">already added</span>`:""}</button>`).join(""):`<div class="small muted" style="padding:10px 12px">${window.LD_HOSTED?"Type the person's full work email address.":"No matching colleague. They must be in your claude.ai organization."}</div>`;
    hits.forEach((h,i)=>{const b=sg.querySelectorAll("button")[i];if(!b)return;b.querySelector("b").textContent=h.name;b.querySelector(".muted").textContent=h.email||"";b.dataset.label=h.name+(h.email?" · "+h.email:"")});sg.hidden=false};
  inp.onfocus=show;inp.oninput=()=>{S.upick=null;show()};
  sg.onclick=e=>{const b=e.target.closest("button[data-pid]");if(!b)return;S.upick={id:b.dataset.pid,label:b.dataset.label};inp.value=b.dataset.label;sg.hidden=true};
  $("#urole").onchange=e=>{S.urole=e.target.value;$("#uengWrap").hidden=S.urole!=="sales"};
  const saveUsers=async(members,msg)=>{try{await S.db.doc("config/users").set({members});S.users=members;S.upick=null;toast(msg);render();return true}catch(e){toast("Couldn't save users: "+(e.code||e.message)+(e.code==="invalid_argument"?" — you need Editor access":""));return false}};
  $("#uAdd").onclick=async()=>{const M=$("#uMsg");const role=$("#urole").value,eng=role==="sales"?$("#ueng").value:"";
    if(!S.upick){M.innerHTML=`<span style="color:var(--bad)">Search for the person and pick them from the list.</span>`;return}
    if(S.users[S.upick.id]||(S.isOwner&&S.upick.id===S.uid)){M.innerHTML=`<span style="color:var(--bad)">This person is already a user. Change their role in the table.</span>`;return}
    if(role==="sales"&&!eng){M.innerHTML=`<span style="color:var(--bad)">Choose which sales engineer name this login belongs to.</span>`;return}
    const members=Object.assign({},S.users,{[S.upick.id]:{role,engineer:eng,addedAt:nowISO(),addedBy:S.uid}});
    const em=S.upick.id,lab=S.upick.label.split(" · ")[0];
    if(await saveUsers(members,"Added "+lab)){S.urole=role;
      if(window.LD_HOSTED&&window.__adminUser){S.userNote={lvl:"info",msg:`Creating a sign-in for ${em}…`};render();const r=await window.__adminUser("create",em);
        S.userNote=r.error?{lvl:"warn",msg:`${em} was added to the list, but the sign-in wasn't created: ${r.error}`}
          :r.status==="exists"?{lvl:"info",msg:`${em} already has a sign-in. Use Reset password if they need the temporary password again.`}
          :{lvl:"ok",msg:`Sign-in created for ${em}. Temporary password: <b class="mono">${esc(r.password)}</b>. They'll be asked to choose their own password the first time they sign in.`};render()}}};
  document.querySelectorAll("[data-urole]").forEach(sel=>sel.onchange=()=>{const id=sel.dataset.urole;const m=Object.assign({},S.users);m[id]=Object.assign({},m[id],{role:sel.value,engineer:sel.value==="sales"?m[id].engineer||"":""});saveUsers(m,"Role updated")});
  document.querySelectorAll("[data-ueng]").forEach(sel=>sel.onchange=()=>{const id=sel.dataset.ueng;const m=Object.assign({},S.users);m[id]=Object.assign({},m[id],{engineer:sel.value});saveUsers(m,"Engineer link updated")});
  document.querySelectorAll("[data-ureset]").forEach(b=>b.onclick=async()=>{const em=b.dataset.ureset;
    if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Confirm reset";return}
    b.disabled=true;b.textContent="Resetting…";const r=await window.__adminUser("reset",em);
    S.userNote=r.error?{lvl:"bad",msg:`Couldn't reset ${em}: ${esc(r.error)}`}:{lvl:"ok",msg:`${r.status==="created"?"Sign-in created":"Password reset"} for ${em}. Temporary password: <b class="mono">${esc(r.password)}</b>. They must choose a new one when they sign in.`};render()});
  document.querySelectorAll("[data-urm]").forEach(b=>b.onclick=()=>{if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Confirm remove";return}const m=Object.assign({},S.users);delete m[b.dataset.urm];saveUsers(m,"User removed")})}
function useCount(name,kind){return S.leads.filter(l=>kind==="p"?productsOf(l).includes(name):l.assignedTo===name).length}

if(window.LD_HOSTED){window.__startApp=boot;if(window.__ldReady)boot()}else boot();
</script>

</body></html>
